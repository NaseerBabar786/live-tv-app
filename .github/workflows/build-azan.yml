name: Build Azan recordings

# Turns the freely licensed Azan recordings from Wikimedia Commons into the MP3s the apps play at prayer
# time (docs/quran/azan, see tools/build_azan.py) and commits them to the branch it ran on.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_azan.py
      - .github/workflows/build-azan.yml

permissions:
  contents: write

concurrency:
  group: build-azan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build the Azan recordings
        run: python3 tools/build_azan.py

      - name: Commit the recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quran/azan
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Iqra Quran: Azan recordings"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
