name: QA on emulators

# Spark Weather 1.0.0 (PR #463) on an Android TV and a phone emulator: every tab, a video, Settings, morning forecast.
# Results go to the "qa-results-spark-weather" pre-release (never "latest").
on:
  workflow_dispatch:
  push:
    branches: ['qa/**']

concurrency:
  group: qa-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: ./gradlew :weather:testDebugUnitTest :weather:assembleDebug 2>&1 | tee unit-tests.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: qa-apks
          path: |
            weather/build/outputs/apk/debug/weather-debug.apk
            unit-tests.txt

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: tv30
            api: 30
            target: android-tv
            arch: x86
            profile: tv_1080p
          - device: phone34
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: timeout 50m bash tools/qa/run_weather_qa.sh qa-out/${{ matrix.device }} apks/weather/build/outputs/apk/debug/weather-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.device }}
          path: qa-out/

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Publish to the qa-results-spark-weather pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir up
          for d in tv30 phone34; do
            for f in all/qa-$d/$d/*; do [ -f "$f" ] && [ -s "$f" ] && [ "${f%.xml}" = "$f" ] && cp "$f" "up/$d-$(basename "$f")"; done
          done
          gh release delete qa-results-spark-weather --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create qa-results-spark-weather --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "QA results Spark Weather (emulators)" \
            --notes "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          (cd up && ls | xargs -n 40 sh -c 'for t in 1 2 3; do gh release upload qa-results-spark-weather --repo "$GITHUB_REPOSITORY" --clobber "$@" && exit 0; sleep 10; done; exit 0' _)
