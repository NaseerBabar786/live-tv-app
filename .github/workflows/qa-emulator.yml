name: QA on emulators

# Spark TV (Google Play edition) on an Android TV emulator and a phone emulator, before the owner's test.
# Results go to the "qa-results-spark" pre-release (never "latest").
on:
  workflow_dispatch:
  push:
    branches: ['qa/**']

concurrency:
  group: qa-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Signed with our key, like the real build (an unsigned APK won't install).
      - name: Load signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/livetv.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/livetv.jks" >> "$GITHUB_ENV"
      - name: Unit tests and the release APK (minified, as Google Play gets it)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 tools/version_codes.py scale
          ./gradlew testSparkDebugUnitTest assembleSparkRelease
      - uses: actions/upload-artifact@v4
        with:
          name: spark-apk
          path: app/build/outputs/apk/spark/release/*.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: tv34
            api: 34
            target: android-tv
            arch: x86
            profile: tv_1080p
          - device: phone34
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spark-apk
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/qa/run_spark_qa.sh qa-out/${{ matrix.device }} "$(ls apks/*.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.device }}
          path: qa-out/

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Publish to the qa-results-spark pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir up
          for d in tv34 phone34; do
            for f in all/qa-$d/$d/*; do [ -s "$f" ] && cp "$f" "up/$d-$(basename "$f")"; done
          done
          ls up
          gh release view qa-results-spark -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create qa-results-spark -R "$GITHUB_REPOSITORY" --prerelease --latest=false --title "QA results: Spark TV" --notes "Emulator QA of Spark TV."
          gh release upload qa-results-spark up/* -R "$GITHUB_REPOSITORY" --clobber
