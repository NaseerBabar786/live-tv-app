name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Version codes x10, so a rebuilt last good version (code + 1) can install over this build
      # when it crashes (see tools/version_codes.py and the rollback job below).
      - name: Version codes x10
        run: python3 tools/version_codes.py scale

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh channel logos
        # Keeps the committed copy if the channel databases can't be reached.
        continue-on-error: true
        run: python3 tools/build_logo_index.py

      - name: Run unit tests
        run: ./gradlew testLivetvDebugUnitTest testPlayerDebugUnitTest testPlusDebugUnitTest testMaxDebugUnitTest :livecam:testDebugUnitTest :claudenotes:testDebugUnitTest :multichat:testDebugUnitTest :appbazaar:testDebugUnitTest :quran:testDebugUnitTest :qurankit:testDebugUnitTest

      # Decodes the private signing key from the repository secrets, when set, so
      # every build is signed with the same key and updates install over the old app.
      - name: Load signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/livetv.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/livetv.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE secret is not set; using a throwaway debug key."
          fi

      # Cable TV ships as a debug APK (sideloaded); Stream Player Plus and Live TV Plus as
      # a release APK plus the app bundle (.aab) that Google Play asks for.
      # Live TV Max is sideloaded like Cable TV, so it is a debug APK too.
      - name: Build Cable TV, Live TV Max, Stream Player Plus and Live TV Plus
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: ./gradlew assembleLivetvDebug assembleMaxDebug assemblePlayerRelease bundlePlayerRelease assemblePlusRelease bundlePlusRelease

      - name: Build Live Cam
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :livecam:assembleDebug

      - name: Build Multi Chat
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :multichat:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multi-chat-debug-apk
          path: multichat/build/outputs/apk/debug/multichat-debug.apk

      - name: Build Iqra Quran
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :quran:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iqra-quran-debug-apk
          path: quran/build/outputs/apk/debug/quran-debug.apk

      - name: Build Notes for Claude
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :claudenotes:assembleDebug

      - name: Build App Bazaar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :appbazaar:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-bazaar-apk
          path: appbazaar/build/outputs/apk/debug/appbazaar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notes-for-claude-apk
          path: claudenotes/build/outputs/apk/debug/claudenotes-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-cam-debug-apk
          path: livecam/build/outputs/apk/debug/livecam-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-debug-apk
          path: app/build/outputs/apk/livetv/debug/app-livetv-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-max-debug-apk
          path: app/build/outputs/apk/max/debug/app-max-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stream-player-plus
          path: |
            app/build/outputs/apk/player/release/*.apk
            app/build/outputs/bundle/playerRelease/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-plus
          path: |
            app/build/outputs/apk/plus/release/*.apk
            app/build/outputs/bundle/plusRelease/*.aab

      # Every build goes to ONE fixed pre-release, "test", that only the owner uses. It is never
      # "latest", and no app looks at it for updates, so nothing reaches users from here. Owner's links:
      # https://github.com/NaseerBabar786/live-tv-app/releases/download/test/LiveTV.apk  (tv.bulkbazaar.ca/test)
      # and the same release for the other apps. Once the owner has tested a build and said yes, the
      # "Release approved build" workflow (release-approved.yml) copies it to the public releases
      # that the apps, the website and App Bazaar read; only then do users see "New update available".
      - name: Publish test build (owner only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v() { grep -oP 'versionName = "\K[^"]+' "$1" | sed -n "${2:-1}p"; }
          cp app/build/outputs/apk/livetv/debug/app-livetv-debug.apk LiveTV.apk
          cp app/build/outputs/apk/max/debug/app-max-debug.apk LiveTVMax.apk
          cp appbazaar/build/outputs/apk/debug/appbazaar-debug.apk AppBazaar.apk
          cp quran/build/outputs/apk/debug/quran-debug.apk IqraQuran.apk
          cp livecam/build/outputs/apk/debug/livecam-debug.apk LiveCam.apk
          cp multichat/build/outputs/apk/debug/multichat-debug.apk MultiChat.apk
          cp claudenotes/build/outputs/apk/debug/claudenotes-debug.apk NotesForClaude.apk
          cat > versions.json <<JSON
          {
            "build": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "cable-tv": "$(v app/build.gradle.kts 1)",
            "live-tv-max": "$(v app/build.gradle.kts 4)",
            "app-bazaar": "$(v appbazaar/build.gradle.kts)",
            "iqra-quran": "$(v quran/build.gradle.kts)",
            "live-cam": "$(v livecam/build.gradle.kts)",
            "multi-chat": "$(v multichat/build.gradle.kts)",
            "notes-for-claude": "$(v claudenotes/build.gradle.kts)"
          }
          JSON
          cat versions.json
          files="LiveTV.apk LiveTVMax.apk AppBazaar.apk IqraQuran.apk LiveCam.apk MultiChat.apk NotesForClaude.apk versions.json"
          if gh release view test > /dev/null 2>&1; then
            gh release upload test $files --clobber
          else
            gh release create test $files --prerelease --latest=false \
              --title "TEST build (owner only)" --notes "Test build."
          fi
          notes=$(python3 -c 'import json; d=json.load(open("versions.json")); print("Owner-only TEST build %s from %s. Not sent to users until approved.\n\n" % (d["build"], d["commit"][:7]) + "\n".join("- %s %s" % (k, d[k]) for k in d if k not in ("build", "commit")))')
          gh release edit test --prerelease --latest=false \
            --title "TEST build ${{ github.run_number }} (Cable TV $(v app/build.gradle.kts 1))" --notes "$notes"

      # Stream Player Plus goes in its own release, one per version, never marked
      # "latest", so Cable TV's download link and update check keep finding Cable TV.
      - name: Publish Stream Player Plus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed -n 2p)
          tag="stream-player-plus-v${version}"
          cp app/build/outputs/apk/player/release/*.apk StreamPlayerPlus.apk
          cp app/build/outputs/bundle/playerRelease/*.aab StreamPlayerPlus.aab
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" StreamPlayerPlus.apk StreamPlayerPlus.aab --clobber
          else
            gh release create "$tag" StreamPlayerPlus.apk StreamPlayerPlus.aab \
              --title "Stream Player Plus $version" \
              --notes "Release build for Google Play (.aab) and for testing (.apk). Built from ${{ github.sha }}." \
              --latest=false
          fi

      # Live TV Plus, like Stream Player Plus, gets its own release per version, never
      # marked "latest", so Cable TV's download link and update check keep finding Cable TV.
      - name: Publish Live TV Plus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed -n 3p)
          tag="live-tv-plus-v${version}"
          cp app/build/outputs/apk/plus/release/*.apk LiveTVPlus.apk
          cp app/build/outputs/bundle/plusRelease/*.aab LiveTVPlus.aab
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" LiveTVPlus.apk LiveTVPlus.aab --clobber
          else
            gh release create "$tag" LiveTVPlus.apk LiveTVPlus.aab \
              --title "Live TV Plus $version" \
              --notes "Release build for Google Play (.aab) and for testing (.apk). Built from ${{ github.sha }}." \
              --latest=false
          fi
          # A fixed "live-tv-plus" release always holds the newest build, so this link never changes:
          # https://github.com/NaseerBabar786/live-tv-app/releases/download/live-tv-plus/LiveTVPlus.apk
          if gh release view live-tv-plus > /dev/null 2>&1; then
            gh release upload live-tv-plus LiveTVPlus.apk LiveTVPlus.aab --clobber
          else
            gh release create live-tv-plus LiveTVPlus.apk LiveTVPlus.aab \
              --title "Live TV Plus (newest)" \
              --notes "Always the newest Live TV Plus build, for testing on phones and TVs." \
              --latest=false
          fi
          gh release edit live-tv-plus --notes "Always the newest Live TV Plus build (now $version), for testing on phones and TVs." || true


  # Crash rollback (owner's rule): rebuilds the last approved version of every app with this build's
  # version code + 1, so an app whose new version closes by itself can go back with one tap
  # (RescueActivity). Owner's test devices use these test/Rollback-*.apk files; when a build is
  # approved, release-approved.yml copies its rollbacks to the public "rollback" release.
  rollback:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/livetv.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/livetv.jks" >> "$GITHUB_ENV"
          fi

      # approved.json (in the "rollback" release) names the commit each app was last approved from.
      # Before the first approval, every app falls back to the commit of the latest Cable TV release.
      - name: Build the last approved versions
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: |
          python3 tools/version_codes.py scale
          gh release download rollback --pattern approved.json --clobber 2>/dev/null || echo '{}' > approved.json
          fallback=$(git rev-list -n1 "$(gh release view --json tagName -q .tagName)")
          mkdir -p out
          # app id, gradle task, built APK (in the old checkout), published name
          while read -r id task built name; do
            commit=$(jq -r --arg k "$id" '.[$k] // empty' approved.json)
            commit=${commit:-$fallback}
            dir="$RUNNER_TEMP/old-$commit"
            if [ ! -d "$dir" ]; then
              git worktree add --detach "$dir" "$commit"
              python3 tools/version_codes.py rollback "$dir"
            fi
            echo "::group::$id from $commit"
            if (cd "$dir" && ./gradlew "$task") && cp "$dir/$built" "out/Rollback-$name"; then
              echo "built Rollback-$name"
            else
              echo "::warning::Could not rebuild the last approved $id from $commit"
            fi
            echo "::endgroup::"
          done <<'LIST'
          cable-tv :app:assembleLivetvDebug app/build/outputs/apk/livetv/debug/app-livetv-debug.apk LiveTV.apk
          live-tv-max :app:assembleMaxDebug app/build/outputs/apk/max/debug/app-max-debug.apk LiveTVMax.apk
          app-bazaar :appbazaar:assembleDebug appbazaar/build/outputs/apk/debug/appbazaar-debug.apk AppBazaar.apk
          iqra-quran :quran:assembleDebug quran/build/outputs/apk/debug/quran-debug.apk IqraQuran.apk
          live-cam :livecam:assembleDebug livecam/build/outputs/apk/debug/livecam-debug.apk LiveCam.apk
          multi-chat :multichat:assembleDebug multichat/build/outputs/apk/debug/multichat-debug.apk MultiChat.apk
          notes-for-claude :claudenotes:assembleDebug claudenotes/build/outputs/apk/debug/claudenotes-debug.apk NotesForClaude.apk
          LIST
          ls -l out
          if ls out/*.apk > /dev/null 2>&1; then gh release upload test out/*.apk --clobber; fi
