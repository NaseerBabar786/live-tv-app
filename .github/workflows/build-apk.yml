name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh channel logos
        # Keeps the committed copy if the channel databases can't be reached.
        continue-on-error: true
        run: python3 tools/build_logo_index.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes the APK as the latest GitHub release so phones and TVs can
      # download it directly from:
      # https://github.com/NaseerBabar786/live-tv-app/releases/latest/download/LiveTV.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v${version}-build${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk LiveTV.apk
          gh release create "$tag" LiveTV.apk \
            --title "Live TV $version (build ${{ github.run_number }})" \
            --notes "Debug build from ${{ github.sha }}." \
            --latest
