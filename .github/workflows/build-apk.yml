name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh channel logos
        # Keeps the committed copy if the channel databases can't be reached.
        continue-on-error: true
        run: python3 tools/build_logo_index.py

      - name: Run unit tests
        run: ./gradlew testLivetvDebugUnitTest testPlayerDebugUnitTest testPlusDebugUnitTest testMaxDebugUnitTest :livecam:testDebugUnitTest :claudenotes:testDebugUnitTest

      # Decodes the private signing key from the repository secrets, when set, so
      # every build is signed with the same key and updates install over the old app.
      - name: Load signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/livetv.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/livetv.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE secret is not set; using a throwaway debug key."
          fi

      # Free Live TV ships as a debug APK (sideloaded); Stream Player Plus and Live TV Plus as
      # a release APK plus the app bundle (.aab) that Google Play asks for.
      # Live TV Max is sideloaded like Free Live TV, so it is a debug APK too.
      - name: Build Free Live TV, Live TV Max, Stream Player Plus and Live TV Plus
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: ./gradlew assembleLivetvDebug assembleMaxDebug assemblePlayerRelease bundlePlayerRelease assemblePlusRelease bundlePlusRelease

      - name: Build Live Cam
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :livecam:assembleDebug

      - name: Build Notes for Claude
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :claudenotes:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: notes-for-claude-apk
          path: claudenotes/build/outputs/apk/debug/claudenotes-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-cam-debug-apk
          path: livecam/build/outputs/apk/debug/livecam-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-debug-apk
          path: app/build/outputs/apk/livetv/debug/app-livetv-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-max-debug-apk
          path: app/build/outputs/apk/max/debug/app-max-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stream-player-plus
          path: |
            app/build/outputs/apk/player/release/*.apk
            app/build/outputs/bundle/playerRelease/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-plus
          path: |
            app/build/outputs/apk/plus/release/*.apk
            app/build/outputs/bundle/plusRelease/*.aab

      # Publishes the APK as the latest GitHub release so phones and TVs can
      # download it directly from:
      # https://github.com/NaseerBabar786/live-tv-app/releases/latest/download/LiveTV.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          tag="v${version}-build${{ github.run_number }}"
          cp app/build/outputs/apk/livetv/debug/app-livetv-debug.apk LiveTV.apk
          gh release create "$tag" LiveTV.apk \
            --title "Free Live TV $version (build ${{ github.run_number }})" \
            --notes "Debug build from ${{ github.sha }}." \
            --latest

      # Stream Player Plus goes in its own release, one per version, never marked
      # "latest", so Free Live TV's download link and update check keep finding Free Live TV.
      - name: Publish Stream Player Plus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed -n 2p)
          tag="stream-player-plus-v${version}"
          cp app/build/outputs/apk/player/release/*.apk StreamPlayerPlus.apk
          cp app/build/outputs/bundle/playerRelease/*.aab StreamPlayerPlus.aab
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" StreamPlayerPlus.apk StreamPlayerPlus.aab --clobber
          else
            gh release create "$tag" StreamPlayerPlus.apk StreamPlayerPlus.aab \
              --title "Stream Player Plus $version" \
              --notes "Release build for Google Play (.aab) and for testing (.apk). Built from ${{ github.sha }}." \
              --latest=false
          fi

      # Live TV Plus, like Stream Player Plus, gets its own release per version, never
      # marked "latest", so Free Live TV's download link and update check keep finding Free Live TV.
      - name: Publish Live TV Plus
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed -n 3p)
          tag="live-tv-plus-v${version}"
          cp app/build/outputs/apk/plus/release/*.apk LiveTVPlus.apk
          cp app/build/outputs/bundle/plusRelease/*.aab LiveTVPlus.aab
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" LiveTVPlus.apk LiveTVPlus.aab --clobber
          else
            gh release create "$tag" LiveTVPlus.apk LiveTVPlus.aab \
              --title "Live TV Plus $version" \
              --notes "Release build for Google Play (.aab) and for testing (.apk). Built from ${{ github.sha }}." \
              --latest=false
          fi
          # A fixed "live-tv-plus" release always holds the newest build, so this link never changes:
          # https://github.com/NaseerBabar786/live-tv-app/releases/download/live-tv-plus/LiveTVPlus.apk
          if gh release view live-tv-plus > /dev/null 2>&1; then
            gh release upload live-tv-plus LiveTVPlus.apk LiveTVPlus.aab --clobber
          else
            gh release create live-tv-plus LiveTVPlus.apk LiveTVPlus.aab \
              --title "Live TV Plus (newest)" \
              --notes "Always the newest Live TV Plus build, for testing on phones and TVs." \
              --latest=false
          fi
          gh release edit live-tv-plus --notes "Always the newest Live TV Plus build (now $version), for testing on phones and TVs." || true

      # Live TV Max: one fixed "live-tv-max" release, never marked "latest", always holding the
      # newest build, so its link never changes and Free Live TV's update check keeps finding Free Live TV:
      # https://github.com/NaseerBabar786/live-tv-app/releases/download/live-tv-max/LiveTVMax.apk
      # Its in-app update check reads the version from this release's title ("Live TV Max 1.0.0").
      - name: Publish Live TV Max
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | sed -n 4p)
          cp app/build/outputs/apk/max/debug/app-max-debug.apk LiveTVMax.apk
          if gh release view live-tv-max > /dev/null 2>&1; then
            gh release upload live-tv-max LiveTVMax.apk --clobber
          else
            gh release create live-tv-max LiveTVMax.apk \
              --title "Live TV Max $version" \
              --notes "Always the newest Live TV Max build." \
              --latest=false
          fi
          gh release edit live-tv-max --title "Live TV Max $version" --notes "Always the newest Live TV Max build (now $version), from ${{ github.sha }}."

      # Live Cam gets its own release per version, never marked "latest", so Free Live TV's
      # download link and update check keep finding Free Live TV. Phones and TVs download it from
      # the fixed "livecam" release below, or from
      # https://github.com/NaseerBabar786/live-tv-app/releases/download/livecam-v<version>/LiveCam.apk
      - name: Publish Live Cam
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' livecam/build.gradle.kts | head -1)
          tag="livecam-v${version}"
          cp livecam/build/outputs/apk/debug/livecam-debug.apk LiveCam.apk
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" LiveCam.apk --clobber
          else
            gh release create "$tag" LiveCam.apk \
              --title "Live Cam $version" \
              --notes "Debug build of the Live Cam app from ${{ github.sha }}." \
              --latest=false
          fi
          # A fixed "livecam" release always holds the newest build, so App Bazaar and the
          # Downloader code tv.bulkbazaar.ca/cam never change:
          # https://github.com/NaseerBabar786/live-tv-app/releases/download/livecam/LiveCam.apk
          if gh release view livecam > /dev/null 2>&1; then
            gh release upload livecam LiveCam.apk --clobber
          else
            gh release create livecam LiveCam.apk \
              --title "Live Cam (newest)" \
              --notes "Always the newest Live Cam build." \
              --latest=false
          fi
          gh release edit livecam --notes "Always the newest Live Cam build (now $version), from ${{ github.sha }}." || true

      # Notes for Claude: one fixed "claude-notes" release, never marked "latest", always holding
      # the newest build, so its link never changes and Free Live TV's update check keeps finding Free Live TV:
      # https://github.com/NaseerBabar786/live-tv-app/releases/download/claude-notes/NotesForClaude.apk
      # Its in-app update check reads the version from this release's title ("Notes for Claude 1.0.0").
      - name: Publish Notes for Claude
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' claudenotes/build.gradle.kts | head -1)
          cp claudenotes/build/outputs/apk/debug/claudenotes-debug.apk NotesForClaude.apk
          if gh release view claude-notes > /dev/null 2>&1; then
            gh release upload claude-notes NotesForClaude.apk --clobber
          else
            gh release create claude-notes NotesForClaude.apk \
              --title "Notes for Claude $version" \
              --notes "Always the newest Notes for Claude build." \
              --latest=false
          fi
          gh release edit claude-notes --title "Notes for Claude $version" --notes "Always the newest Notes for Claude build (now $version), from ${{ github.sha }}."
