name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh channel logos
        # Keeps the committed copy if the channel databases can't be reached.
        continue-on-error: true
        run: python3 tools/build_logo_index.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
