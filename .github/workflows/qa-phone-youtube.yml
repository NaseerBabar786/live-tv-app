name: QA phone YouTube pages
# QA branch only (qa/phone-youtube): why our YouTube channels don't play on phones.
on:
  push:
    branches: ['qa/phone-youtube']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleLivetvDebug
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: app/build/outputs/apk/livetv/debug/app-livetv-debug.apk }
  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: phone, api: 34, target: google_apis, arch: x86_64, profile: pixel_6 }
          - { device: phone36, api: 36, target: google_apis, arch: x86_64, profile: pixel_6 }
          - { device: tv, api: 30, target: android-tv, arch: x86, profile: tv_1080p }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/qa/phone_youtube.sh qa-out/${{ matrix.device }} apk/app-livetv-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.device }}
          path: qa-out/${{ matrix.device }}
  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: all }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir up
          for d in phone phone36 tv; do [ -d all/qa-$d ] && for f in all/qa-$d/*; do [ -s "$f" ] && cp "$f" "up/$d-$(basename "$f")"; done; done
          gh release delete qa-phone-youtube --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create qa-phone-youtube --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" --title "QA: YouTube pages on phone" --notes "QA only" up/*
