name: Check streams

# Tests every channel in the iptv-org and Famelack lists and publishes playlists
# of the working ones on the website (docs/AllChannels.m3u, docs/LiveTV.m3u).
on:
  schedule:
    - cron: "0 9 * * *"   # every day, 09:00 UTC (5 a.m. Eastern)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: check-streams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Test every stream
        run: python3 tools/check_streams.py

      # A push made with the workflow's own token doesn't start other workflows,
      # so the APK isn't rebuilt; the website is rebuilt explicitly below.
      - name: Publish the playlists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AllChannels.m3u docs/LiveTV.m3u docs/playlists.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Playlists: working channels as of $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
