name: Check sample streams

on:
  push:
    paths: [app/src/main/assets/sample.m3u, .github/workflows/check-streams.yml]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe every URL in the sample playlist
        run: |
          for url in $(grep -v '^#' app/src/main/assets/sample.m3u | grep -E '^https?://'); do
            code=$(curl -sSL -m 15 -o /dev/null -w '%{http_code}' -A 'LiveTV-Android/1.0' "$url" || echo ERR)
            echo "$code $url"
          done
          # For HLS master playlists, also probe the first variant playlist,
          # since a master can answer 200 while its streams are gone.
          for url in $(grep -v '^#' app/src/main/assets/sample.m3u | grep -E '\.m3u8$'); do
            variant=$(curl -sSL -m 15 -A 'LiveTV-Android/1.0' "$url" | grep -v '^#' | grep -m1 . || true)
            [ -z "$variant" ] && continue
            case "$variant" in http*) vurl="$variant" ;; *) vurl="${url%/*}/$variant" ;; esac
            code=$(curl -sSL -m 15 -o /dev/null -w '%{http_code}' -A 'LiveTV-Android/1.0' "$vurl" || echo ERR)
            echo "VARIANT $code $vurl"
          done
