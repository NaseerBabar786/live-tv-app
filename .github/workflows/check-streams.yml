name: Check sample streams

on:
  push:
    paths: [app/src/main/assets/sample.m3u, .github/workflows/check-streams.yml]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe every URL in the sample playlist
        run: |
          for url in $(grep -v '^#' app/src/main/assets/sample.m3u | grep -E '^https?://'); do
            code=$(curl -sSL -m 15 -o /dev/null -w '%{http_code}' -A 'LiveTV-Android/1.0' "$url" || echo ERR)
            echo "$code $url"
          done
          # Candidate replacements
          for url in \
            https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8 \
            https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8 \
            https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_16x9/bipbop_16x9_variant.m3u8 \
            https://moctobpltc-i.akamaihd.net/hls/live/571329/eight/playlist.m3u8 \
            https://demo.unified-streaming.com/k8s/live/stable/scte35.isml/.m3u8 \
            https://demo.unified-streaming.com/k8s/live/stable/univision.isml/.m3u8 \
            https://livesim2.dashif.org/livesim2/testpic_2s/Manifest.mpd \
            https://cdn.bitmovin.com/content/assets/art-of-motion-dash-hls-progressive/m3u8s/f08e80da-bf1d-4e3d-8899-f0f6155f6efa.m3u8 \
            https://storage.googleapis.com/shaka-live-assets/player-source.m3u8 \
            https://ireplay.tv/test/blender.m3u8 \
            https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8 \
            https://live-hls-web-aje.getaj.net/AJE/index.m3u8 \
            https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8 \
            https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8 ; do
            code=$(curl -sSL -m 15 -o /dev/null -w '%{http_code}' -A 'LiveTV-Android/1.0' "$url" || echo ERR)
            echo "CANDIDATE $code $url"
          done
