name: News archive

# Owner (2026-10-08): keep the day's full news report in the Library under the channel's name, one a day,
# the newest 30. Runs after the 9 PM (Toronto) full report is up and before the midnight one replaces it.
# Owner (2026-10-10): every headlines bulletin too, kept 30 days, as its own row: archived after each
# "Build news bulletins" run (a bulletin already archived is skipped).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_run:
    workflows: ["Build news bulletins"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: news-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Archive today's full report, or the newest headlines
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/channel-media"
          if [ "$EVENT" = workflow_run ]; then kind=headlines; else kind=full; fi
          curl -fsSL -o "news-$kind.json" "$base/news-$kind.json"
          if [ "$kind" = headlines ]; then
            # Most runs build nothing new: skip the download when this bulletin is already in the archive.
            name=$(python3 -c "import datetime as d, json; s=d.datetime.fromisoformat(json.load(open('news-headlines.json'))['slot']); print(f'news-headlines-{s.date()}-{s.hour:02d}.mp4')")
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/news-archive" -q '.assets[].name' 2>/dev/null | grep -qx "$name"; then
              echo "$name is already archived"; exit 0
            fi
          fi
          curl -fsSL -o "news-$kind.mp4" "$base/news-$kind.mp4"
          python3 tools/news/archive.py "news-$kind.mp4" "news-$kind.json" "$kind"
      - name: Save the Library list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/NewsArchive.m3u
          git diff --cached --quiet && exit 0
          git commit -m "News archive: the newest news in the Library"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
