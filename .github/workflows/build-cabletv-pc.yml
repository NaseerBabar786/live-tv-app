name: Build Cable TV for PC

# Cable TV for Windows (Electron, cabletv-pc/). Builds the installer and the portable .exe on a
# Windows runner. On main they go to the "candidate" pre-release (copied to the owner-only "test" by offer-test.yml) (owner's release rule),
# with versions-pc.json saying which version they are; release-approved.yml (cable-tv-pc) sends
# them to everyone after the owner's yes, in the fixed "cable-tv-pc" release:
# https://github.com/NaseerBabar786/live-tv-app/releases/download/cable-tv-pc/CableTV-PC-Setup.exe
# https://github.com/NaseerBabar786/live-tv-app/releases/download/cable-tv-pc/CableTV-PC-Portable.exe
# The app's update check reads the version from that release's title ("Cable TV for PC 1.0.0").

on:
  push:
    branches: [main]
    paths:
      - 'cabletv-pc/**'
      - 'docs/channel/schedule.js'
      - 'docs/channel/cards.js'
      - 'docs/channel/clock.js'
      - '.github/workflows/build-cabletv-pc.yml'
  pull_request:
    paths:
      - 'cabletv-pc/**'
      - 'docs/channel/schedule.js'
      - 'docs/channel/cards.js'
      - 'docs/channel/clock.js'
      - '.github/workflows/build-cabletv-pc.yml'
  workflow_dispatch:

concurrency:
  group: cabletv-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: cabletv-pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cabletv-pc/package-lock.json

      - run: npm ci

      - name: Check and test
        run: npm run check

      # The TV sign-in secret goes into the app as in the APK build (never in the code).
      - name: Build installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: cable-tv-windows
          path: |
            cabletv-pc/dist/CableTV-PC-Setup.exe
            cabletv-pc/dist/CableTV-PC-Portable.exe

      - name: Publish test build (owner only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cd dist
          printf '{\n  "cable-tv-pc": "%s",\n  "run": %s,\n  "commit": "%s"\n}\n' "$version" "${{ github.run_number }}" "${{ github.sha }}" > versions-pc.json
          cat versions-pc.json
          files="CableTV-PC-Setup.exe CableTV-PC-Portable.exe versions-pc.json"
          if gh release view candidate > /dev/null 2>&1; then
            gh release upload candidate $files --clobber
          else
            gh release create candidate $files --prerelease --latest=false --title "CANDIDATE build" --notes "Candidate build."
          fi
          echo "Cable TV for PC $version is in the candidate release (offered to the owner by offer-test.yml)." >> "$GITHUB_STEP_SUMMARY"
