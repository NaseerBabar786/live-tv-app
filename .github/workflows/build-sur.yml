name: Build Bazaar Music

# Bazaar Music, our music channel (channel 3 in Free Live TV): picks free-to-use songs on Wikimedia Commons
# (public domain, CC0, CC BY; no film songs), makes each a 720p MP4 with the song's name on screen,
# puts them on the "sur-media" pre-release and writes docs/channel/sur-schedule.json.
# Songs already on the release are kept. A pull request only tries a few songs.
on:
  push:
    branches: [main]
    paths: [tools/build_sur.py, .github/workflows/build-sur.yml]
  pull_request:
    paths: [tools/build_sur.py, .github/workflows/build-sur.yml]
  schedule:
    - cron: "0 13 1 * *"   # the 1st of each month: new songs found since
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-sur
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow

      - name: Make the songs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view sur-media -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > have.txt 2>/dev/null || true
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then limit=60; else limit=3; fi
          python3 tools/build_sur.py --out out --have have.txt --limit "$limit"
          ls -la out

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release, so it never becomes "latest" (the app's download link uses latest).
          gh release view sur-media -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create sur-media -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Bazaar Music songs" --notes "Songs for Bazaar Music, free to use (public domain, CC0 and CC BY, from Wikimedia Commons)."
          ls out/*.mp4 >/dev/null 2>&1 && gh release upload sur-media out/*.mp4 -R "$GITHUB_REPOSITORY" --clobber || echo "No new songs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/sur-schedule.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Bazaar Music songs as of $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
