name: Lock tomorrow's schedules

# docs/channel/locked/<id>.json: each of our YouTube channels' day, locked the night before (the owner's
# rule, 2026-10-07: a day's schedule never changes once made). Tomorrow's day is made from the programmes
# the owner approved in Channel Studio, our promos and the trailers (tools/lock_schedules.mjs); today's is
# kept as it was locked. The 05:30 UTC run makes sure the new day has one even if the night run was late.
on:
  schedule:
    - cron: "0 2 * * *"    # 10 PM Toronto (summer time), 9 PM in winter
    - cron: "30 5 * * *"   # after midnight Toronto: the new day is locked if it wasn't yet
  push:
    branches: [main]
    paths: [tools/lock_schedules.mjs, docs/channel/ytorder.js, .github/workflows/lock-schedules.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: lock-schedules
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lock the schedules
        run: node tools/lock_schedules.mjs
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/locked
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Locked schedules as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
