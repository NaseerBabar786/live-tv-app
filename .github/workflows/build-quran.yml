name: Build Quran text

# Builds the Quran text and translations that Iqra Quran ships inside the app
# (qurankit/src/main/assets/quran) and commits them to the branch it ran on.
# The text never changes, so this only runs when started by hand or when the builder changes.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build_quran.py
      - .github/workflows/build-quran.yml

permissions:
  contents: write

concurrency:
  group: build-quran-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Quran text
        run: python3 tools/build_quran.py

      - name: Commit the text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qurankit/src/main/assets/quran
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Iqra Quran: Quran text and translations"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
