name: Probe library check (temporary)
on:
  push:
    branches: [library-quality]
    paths: [tools/library_check.py, tools/probe_yt.py, .github/workflows/probe-library-check.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: for v in 2xL-zwKVr80 zeVJK-yO2WE 2fuEQ2IT7Tw; do python3 tools/probe_yt.py $v; done
      - run: >
          python3 tools/library_check.py --probe 2xL-zwKVr80 zeVJK-yO2WE Y5Z3ye_Enrg 3nZUNt-qJbY 2KA-zeHYG0A
          https://vimeo.com/1228694119
          "https://images-assets.nasa.gov/video/GRC-2014-CM-0141/GRC-2014-CM-0141~orig.mp4"
      - name: Scan the English films
        run: |
          grep -B1 -A0 'tvg-language="English" tvg-genre="Movies"' docs/Dramas.m3u | grep -A1 EXTINF | grep -o 'v=[A-Za-z0-9_-]\{11\}' | cut -c3- | head -150 > ids.txt
          wc -l ids.txt
          python3 - <<'PY'
          import sys; sys.path.insert(0, "tools")
          import library_check as lc
          from concurrent.futures import ThreadPoolExecutor
          ids = open("ids.txt").read().split()
          with ThreadPoolExecutor(8) as p:
              res = list(p.map(lc.look, ids))
          ch = sorted((i.get("changes", -1), v, i.get("pictures"), i.get("mins")) for v, i in res)
          print("lowest changes:", ch[:15])
          print("no info:", sum(1 for v, i in res if "changes" not in i), "no mins:", sum(1 for v, i in res if "mins" not in i))
          print("stills:", [v for v, i in res if i.get("still")])
          PY
