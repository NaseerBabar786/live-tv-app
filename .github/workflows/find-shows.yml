name: Find free shows
on:
  push:
    branches: [shows-library]
    paths: [tools/check_shows.py, tools/shows_candidates.json, .github/workflows/find-shows.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/check_shows.py tools/shows_candidates.json
