name: Build Bazaar Hits

# docs/channel/bollywood.json: the song list of Bazaar Hits (channel 4 in Cable TV), from the
# music labels' own YouTube channels. Played in YouTube's player on tv.bulkbazaar.ca/channel/bollywood.html.
on:
  schedule:
    - cron: "30 9 * * *"   # every day, 09:30 UTC
  push:
    branches: [main]
    paths: [tools/build_bollywood.py, .github/workflows/build-bollywood.yml]
  pull_request:
    paths: [tools/build_bollywood.py, .github/workflows/build-bollywood.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-bollywood
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the song list
        run: python3 tools/build_bollywood.py

      - name: Publish the song list
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/bollywood.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Bazaar Hits songs as of $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
