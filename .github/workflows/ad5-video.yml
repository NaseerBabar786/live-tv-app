name: Ad 5 AI video
# Makes the raw parts of Cable TV Video Ad 5 (one runner per scene, so each uses its own free quota).
on:
  push:
    branches: [ad5-ai-video]
    paths: ["tools/ad5/**", ".github/workflows/ad5-video.yml"]
  workflow_dispatch:
jobs:
  scene:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        scene: [s1, s2, s3, s4, s5, s6]
    steps:
      - uses: actions/checkout@v4
      - name: Should this scene run?
        id: want
        run: |
          if grep -qw "${{ matrix.scene }}" tools/ad5/todo.txt; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.want.outputs.go == '1'
        run: pip install -q gradio_client edge-tts pillow
      - name: Run
        if: steps.want.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ matrix.scene }}
          VOICES: "0"
          TRY_SEEDS: ''
          MODE: lips
          CPU_LIPS: "1"
        run: |
          set -eu
          cd tools/ad5
          bash run.sh
