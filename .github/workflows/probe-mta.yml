name: Probe MTA
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null
          C=https://dq1c55erlhlb2.cloudfront.net/out/v1/prod-mtai-live-shared
          for id in mta1_world_main mta2_europe mta3_alarabia mta4_africa mta5_africa mta6_asia mta7_asia mta8_america; do
            echo "== $id $(timeout 40 ffprobe -v error -show_entries stream=codec_type,width,height -of csv=p=0 $C/prod_$id/prod_$id-origin-v1/index-hls.m3u8 2>&1 | sort -u | tr '\n' ' ')"
          done
          for u in https://chlivemta1.akamaized.net/hls/live/2008145/mta2/playlist.m3u8 https://livemtaasia.akamaized.net/hls/live/2039224/mta6asia/playlist.m3u8; do
            echo "== old $u $(timeout 40 ffprobe -v error -show_entries stream=codec_type -of csv=p=0 $u 2>&1 | sort -u | head -3 | tr '\n' ' ')"
          done
