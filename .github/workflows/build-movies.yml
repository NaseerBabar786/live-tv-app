name: Build movies playlist

# Builds docs/Movies.m3u (tv.bulkbazaar.ca/Movies.m3u): free public-domain films
# and TV series from the Internet Archive, for Live TV's Movies & Series screen.
on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays, 10:00 UTC
  workflow_dispatch:
  push:
    branches: [movies-playlist]

permissions:
  contents: write
  pages: write

concurrency:
  group: build-movies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the playlist
        run: python3 tools/build_movies.py

      - name: Show a sample
        run: |
          cat docs/movies.json
          head -n 21 docs/Movies.m3u
          grep -A1 "Classic TV series" docs/Movies.m3u | head -n 12

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      - name: Publish the playlist
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Movies.m3u docs/movies.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Movies playlist: public-domain films and TV as of $(date -u '+%Y-%m-%d') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
