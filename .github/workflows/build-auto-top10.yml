name: Build Spark Auto Top 10

# Spark Auto (47)'s own "Top 10 of the week" (tools/auto/make_top10.py): the ten most-watched car videos
# posted on the channel's sources in the last week, as a countdown read by a free AI voice over library
# music. Made every Monday; the video goes on the "channel-media" pre-release and its list to
# docs/channel/auto-clips.json, and the channel plays it in a break once an hour.
# On a pull request the show is made but not published, to check the voice and the maker still work.

on:
  schedule:
    - cron: "15 11 * * 1"
  push:
    branches: [main]
    paths: ["tools/auto/**", ".github/workflows/build-auto-top10.yml"]
  pull_request:
    paths: ["tools/auto/**", ".github/workflows/build-auto-top10.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-top10
  cancel-in-progress: false

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts numpy pillow

      - name: Make the show
        run: python3 tools/auto/make_top10.py out

      - name: Keep a sample
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: auto-top10-sample
          path: out/

      - name: Upload and publish the list
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view channel-media >/dev/null 2>&1 || \
            gh release create channel-media --prerelease --latest=false --title "Channel media" --notes "Videos for our channels."
          gh release upload channel-media out/auto-top10.mp4 --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp out/auto-clips.json docs/channel/auto-clips.json
            git add docs/channel/auto-clips.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Spark Auto Top 10 of the week"
            git push origin HEAD:main && break
            sleep $((i * 5))
          done
          git fetch -q origin main && git merge-base --is-ancestor HEAD origin/main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
