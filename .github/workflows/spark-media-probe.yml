name: spark media probe (temporary)
on:
  push:
    branches: [spark-media-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sL -o m.tgz https://github.com/${{ github.repository }}/releases/download/spark-ad-media/spark-music.tgz
          tar xzf m.tgz
          ffmpeg -v error -y -i m/04.mp3 -vn -c:a aac -b:a 192k sur-inspiring-advertising-rafael-krux.mp4
          gh release upload sur-media sur-inspiring-advertising-rafael-krux.mp4 -R ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
