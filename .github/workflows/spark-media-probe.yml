name: spark media probe (temporary)
on:
  push:
    branches: [spark-media-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/spark_music.py
      - run: |
          tar czf spark-music.tgz -C out m
          gh release delete-asset spark-ad-media spark-music.tgz -y || true
          gh release upload spark-ad-media spark-music.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
