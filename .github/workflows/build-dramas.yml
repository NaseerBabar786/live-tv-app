name: Build dramas playlist

# Builds docs/Dramas.m3u (tv.bulkbazaar.ca/Dramas.m3u): the newest Pakistani drama
# episodes, telefilms, cooking and Islamic shows and Urdu cartoons from their owners' official YouTube uploads, for Live TV's Library.
on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-dramas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the playlist
        run: python3 tools/build_dramas.py

      - name: Show a sample
        run: |
          python3 -c "import json; d=json.load(open('docs/dramas.json')); print(d['built'], d['shows'], 'shows', d['episodes'], 'episodes', d.get('movies'), 'movies')"
          head -n 21 docs/Dramas.m3u
          grep -c "Hindi dubbed" docs/Dramas.m3u || true
          grep -A0 "group-title=\"Telefilms\"" docs/Dramas.m3u | sed "s/.*,//" | head -n 40
          echo "== Dailymotion"; grep -B1 "dailymotion.com" docs/Dramas.m3u | grep "^#EXTINF" | sed 's/.*group-title="\([^"]*\)",/\1 | /' | awk -F" [|] " '{c[$1]++; if (c[$1] <= 8) print}'
          echo "== Kapil"; grep -i "kapil" docs/Dramas.m3u | grep "^#EXTINF" | sed 's/.*,//' | head -n 10
          for l in Hindi Punjabi English; do echo "== $l"; grep "tvg-language=\"$l\"" docs/Dramas.m3u | grep -v "Hindi dubbed" | sed "s/.*tvg-genre=\"\\([A-Za-z]*\\)\" group-title=\"\\([^\"]*\\)\",/\\1 | \\2 | /" | awk -F" [|] " "{c[\$1\" | \"\$2]++; if (c[\$1\" | \"\$2] <= 4) print}"; done

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      - name: Publish the playlist
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Dramas.m3u docs/dramas.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Dramas playlist: newest episodes as of $(date -u '+%Y-%m-%d') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
