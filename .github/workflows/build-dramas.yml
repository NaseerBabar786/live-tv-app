name: Build dramas playlist

# Builds docs/Dramas.m3u (tv.bulkbazaar.ca/Dramas.m3u): the newest Pakistani drama
# episodes, telefilms, cooking and Islamic shows and Urdu cartoons from their owners' official YouTube uploads, for Cable TV's Library,
# and docs/MTA.m3u (MTA's own programmes, a folder each, in Urdu and English).
on:
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC: 5 am in Toronto (4 am in winter)
  workflow_dispatch:
  # Changes to the builder are tried out on their pull request (nothing is published there).
  pull_request:
    paths:
      - tools/build_dramas.py
      - tools/library_check.py
      - tools/library_titles.py
      - .github/workflows/build-dramas.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: build-dramas-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the playlist
        run: python3 tools/build_dramas.py

      # The day each programme first showed up, for the Library's "Newly added" section.
      - name: Mark newly added programmes
        run: python3 tools/first_seen.py docs/Dramas.m3u docs/MTA.m3u

      # Owner's rule (2026-10-08): every Library video is checked before it's listed (no still pictures,
      # no trailers or clips, nothing viewers reported), and every title gets its length and a line about it.
      - name: Check the programmes, add lengths and descriptions
        run: |
          pip install --quiet pillow
          python3 tools/library_check.py docs/Dramas.m3u docs/MTA.m3u

      - name: Show a sample
        run: |
          python3 -c "import json; d=json.load(open('docs/dramas.json')); print(d['built'], d['shows'], 'shows', d['episodes'], 'episodes', d.get('movies'), 'movies')"
          head -n 21 docs/Dramas.m3u
          echo "== Release years and trailers"; echo "year: $(grep -c ' year=' docs/Dramas.m3u)  pub: $(grep -c ' pub=' docs/Dramas.m3u)  trailer: $(grep -c ' trailer=' docs/Dramas.m3u)"
          grep -o 'year="[0-9]*"\|trailer="[^"]*"\|tvg-genre="Movies"[^,]*,.*' docs/Dramas.m3u | grep -B2 'tvg-genre="Movies"' | head -n 30 || true
          grep ' trailer=' docs/Dramas.m3u | sed 's/.*year="\([0-9]*\)".*trailer="\([^"]*\)".*group-title="\([^"]*\)",/\1 | \2 | \3 | /' | head -n 25 || true
          cat docs/library-count.json
          grep -c "Hindi dubbed" docs/Dramas.m3u || true
          echo "== English"; grep "tvg-language=\"English\"" docs/Dramas.m3u | sed 's/.*tvg-genre="\([^"]*\)" group-title="\([^"]*\)",/\1 | \2 | /' | awk -F" [|] " '{k=$1"|"$2; c[k]++; if (c[k] <= 3) print}'
          echo "== English counts"; grep "tvg-language=\"English\"" docs/Dramas.m3u | sed 's/.*group-title="\([^"]*\)".*/\1/' | sort | uniq -c
          grep -A0 "group-title=\"Telefilms\"" docs/Dramas.m3u | sed "s/.*,//" | head -n 40
          echo "== Dailymotion"; grep -B1 "dailymotion.com" docs/Dramas.m3u | grep "^#EXTINF" | sed 's/.*group-title="\([^"]*\)",/\1 | /' | awk -F" [|] " '{c[$1]++; if (c[$1] <= 8) print}'
          echo "== Kapil"; grep -i "kapil" docs/Dramas.m3u | grep "^#EXTINF" | sed 's/.*,//' | head -n 10
          echo "== MTA"; grep "^#EXTINF" docs/MTA.m3u | sed "s/.*tvg-language=\"\([A-Za-z]*\)\" tvg-genre=\"\([A-Za-z]*\)\" group-title=\"\([^\"]*\)\",/\1 | \2 | \3 | /" | awk -F" [|] " "{c[\$3]++; if (c[\$3] <= 5) print}"
          echo "== MTA counts"; grep "^#EXTINF" docs/MTA.m3u | sed 's/.*tvg-language="\([A-Za-z]*\)" tvg-genre="\([A-Za-z]*\)" group-title="\([^"]*\)".*/\1 | \2 | \3/' | sort | uniq -c
          for l in Hindi Punjabi English; do echo "== $l"; grep "tvg-language=\"$l\"" docs/Dramas.m3u | grep -v "Hindi dubbed" | sed "s/.*tvg-genre=\"\\([A-Za-z]*\\)\" group-title=\"\\([^\"]*\\)\",/\\1 | \\2 | /" | awk -F" [|] " "{c[\$1\" | \"\$2]++; if (c[\$1\" | \"\$2] <= 4) print}"; done

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      # The owner's rule (2026-10-07): no video goes on air until it passes the pre-air check; one that
      # would show YouTube's error or "Watch on YouTube" screen is taken off the list first.
      - name: Pre-air check
        run: python3 tools/preair_check.py --lists --files docs/Dramas.m3u docs/MTA.m3u

      - name: Publish the playlist
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Dramas.m3u docs/dramas.json docs/MTA.m3u docs/library-info docs/library-count.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Dramas playlist: newest episodes as of $(date -u '+%Y-%m-%d') UTC"
          # The hourly pre-air check also commits the lists; when it did so during this build, this build's
          # list wins (it already passed its own checks above). Tried a few times in case main moves again.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          git fetch -q origin main && git merge-base --is-ancestor HEAD origin/main || { echo "::error::The playlist could not be published."; exit 1; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
