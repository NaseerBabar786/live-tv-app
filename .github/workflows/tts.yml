name: name-clips
on:
  push:
    branches: [tts-name-clips]
permissions:
  contents: write
jobs:
  tts:
    if: "!contains(github.event.head_commit.message, 'clips made')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          mkdir -p clips
          say() { edge-tts --voice "$1" --rate=-10% --text "$2" --write-media "clips/$3.mp3"; }
          say ur-PK-UzmaNeural "السلام علیکم۔ ٹورنٹو میں رات کے نو بجے ہیں، اور یہ ہے اسپارک ٹی وی نیوز۔" news-ur
          say hi-IN-SwaraNeural "नमस्कार। टोरंटो में रात के नौ बजे हैं, और यह है स्पार्क टीवी न्यूज़।" news-hi
          say ur-PK-AsadNeural "آپ دیکھ رہے ہیں اسپارک ٹی وی۔ اسپارک ٹی وی کے ساتھ رہیے۔" ident-ur
          say ur-PK-AsadNeural "صرف اسپارک ٹی وی پر، کیبل ٹی وی ایپ میں، بالکل مفت۔" promo-ur
          ls -la clips
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add clips && git commit -m "clips made" && git push
