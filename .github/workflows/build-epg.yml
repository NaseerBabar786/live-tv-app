name: Build TV guide

# Builds docs/epg.json (tv.bulkbazaar.ca/epg.json): what's on now and next on our channels,
# for Live TV Max. Listings change through the day, hence every 6 hours (each build covers 30).
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  # Changes to the builder are tried out on their pull request (nothing is published there).
  pull_request:
    paths:
      - tools/build_epg.py
      - .github/workflows/build-epg.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: build-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the guide
        run: python3 tools/build_epg.py

      - name: Show a sample
        run: head -c 1500 docs/epg.json; echo

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      - name: Publish the guide
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/epg.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "TV guide: as of $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
