name: Build Pakistani live channels

# Builds docs/PakistanLive.m3u (tv.bulkbazaar.ca/PakistanLive.m3u): Pakistani channels' own
# 24/7 YouTube live streams. Their live video changes when a stream restarts, hence every 3 hours.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  # Changes to the builder are tried out on their pull request (nothing is published there).
  pull_request:
    paths:
      - tools/build_live.py
      - .github/workflows/build-live.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: build-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the playlist
        run: python3 tools/build_live.py

      - name: Show it
        run: cat docs/PakistanLive.m3u

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      # The owner's rule (2026-10-07): no video goes on air until it passes the pre-air check; one that
      # would show YouTube's error or "Watch on YouTube" screen is taken off the list first.
      - name: Pre-air check
        run: python3 tools/preair_check.py --lists --files docs/PakistanLive.m3u

      - name: Publish the playlist
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PakistanLive.m3u
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Pakistani live channels: as of $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
