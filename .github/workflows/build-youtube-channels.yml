name: Build YouTube channel lists

# docs/channel/yt-<id>.json: the video lists of our channels that run like Spark Hits (Cinema 2,
# Music 3, Kids 5, Sports 6, Travel 7, Comedy 8), from official YouTube channels. Played in
# YouTube's player, locked, on tv.bulkbazaar.ca/channel/ytc.html?c=<id> (also in the app).
on:
  schedule:
    - cron: "45 9 * * *"   # every day, 09:45 UTC
    - cron: "15 */3 * * *" # Spark Sports every 3 hours, so main events show soon after they're posted
  push:
    branches: [main]
    paths: [tools/build_youtube_channels.py, .github/workflows/build-youtube-channels.yml]
  pull_request:
    paths: [tools/build_youtube_channels.py, .github/workflows/build-youtube-channels.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-youtube-channels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the lists
        run: |
          if [ "${{ github.event.schedule }}" = "15 */3 * * *" ]; then
            python3 tools/build_youtube_channels.py --channel sports
          else
            python3 tools/build_youtube_channels.py
          fi

      # The owner's rule (2026-10-07): no video goes on air until it passes the pre-air check; one that
      # would show YouTube's error or "Watch on YouTube" screen is taken off the list first.
      - name: Pre-air check
        run: python3 tools/preair_check.py --lists --files docs/channel/yt-*.json

      - name: Publish the lists
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/yt-*.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "YouTube channel lists as of $(date -u '+%Y-%m-%d')"
          # The hourly pre-air check may have committed a list meanwhile: on a clash this build's list wins
          # (it passed the pre-air check above), like build-dramas.yml. Tried a few times in case main moves again.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          git fetch -q origin main && git merge-base --is-ancestor HEAD origin/main || { echo "::error::The lists could not be published."; exit 1; }
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
