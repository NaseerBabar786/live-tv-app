name: QA TV extras on an emulator

# The TV extras (PR #371) on an Android TV emulator, with screenshots. Its own group and release
# ("qa-extras-results", never "latest"), so it never cancels or replaces the nightly QA run.
on:
  push:
    branches: ['qa/tv-extras']

concurrency:
  group: qa-extras
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Built without the TV sign-in secret, so the app skips sign-in on the emulator.
      - name: Build no-sign-in APK
        run: ./gradlew assembleLivetvDebug
      - name: Download the public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rel
          gh release download --repo "$GITHUB_REPOSITORY" --pattern LiveTV.apk --output rel/public.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qa-apks
          path: |
            rel/
            app/build/outputs/apk/livetv/debug/app-livetv-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/qa/run_extras.sh qa-out apks/app/build/outputs/apk/livetv/debug/app-livetv-debug.apk apks/rel/public.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-out
          path: qa-out

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-out
          path: up
      - name: Publish to the qa-extras-results pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete qa-extras-results --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create qa-extras-results --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "QA results: TV extras (emulator)" \
            --notes "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            $(find up -type f -size +0 ! -name '_tap.xml')
