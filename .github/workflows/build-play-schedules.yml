name: Build Spark TV schedules

# Spark TV, our Google Play app, plays only channels we own outright. tools/build_play_schedules.py makes
# their schedules (docs/channel/play/<id>.json) from our other channels' schedules, with every YouTube
# video left out, and fails if one slips in. Runs whenever those schedules change and once a day.
on:
  push:
    branches: [main]
    paths:
      - tools/build_play_schedules.py
      - .github/workflows/build-play-schedules.yml
      - docs/channel/filmein-schedule.json
      - docs/channel/comedy-schedule.json
      - docs/channel/sports-schedule.json
      - docs/channel/travel-schedule.json
      - docs/channel/sur-schedule.json
      - docs/channel/ads-sponsors.json
      - docs/channel/test-schedule.json
  pull_request:
    paths: [tools/build_play_schedules.py, .github/workflows/build-play-schedules.yml]
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-play-schedules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make the schedules
        run: python3 tools/build_play_schedules.py

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/play
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Spark TV schedules as of $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
