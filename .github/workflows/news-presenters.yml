name: News presenters

# Makes the AI newsreaders for Bazaar TV News (tools/news/presenters/presenters.json):
#   1. a picture of each presenter (Pollinations, free), kept on the channel-media release as <id>.jpg,
#   2. a talking sample of each one reading the Urdu test line (edge-tts voice + SadTalker, Apache 2.0),
#      uploaded as news-sample-<id>.mp4.
# SadTalker on GitHub's CPUs needs about 2 minutes per second of speech, so presenters only say short
# fixed lines made once here; the news itself is read over our graphics.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Presenter id (empty = all)"
        required: false
        default: ""
      repicture:
        description: "Make the pictures again"
        type: boolean
        default: false

concurrency:
  group: news-presenters
  cancel-in-progress: false

jobs:
  pictures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          echo "ids=$(python3 -c "
          import json, os
          ids = [p['id'] for p in json.load(open('tools/news/presenters/presenters.json'))['presenters']]
          only = os.environ.get('ONLY')
          print(json.dumps([i for i in ids if not only or i == only]))")" >> "$GITHUB_OUTPUT"
      - name: Make missing pictures
        env:
          GH_TOKEN: ${{ github.token }}
          REPICTURE: ${{ github.event.inputs.repicture }}
          IDS: ${{ steps.ids.outputs.ids }}
        run: |
          pip install -q pillow
          mkdir -p pics
          python3 - <<'EOF'
          import json, os, time, urllib.parse, urllib.request
          from PIL import Image
          cfg = json.load(open("tools/news/presenters/presenters.json"))
          have = set(os.popen("gh release view channel-media --json assets -q '.assets[].name'").read().split())
          for p in cfg["presenters"]:
              if p["id"] not in json.loads(os.environ["IDS"]): continue
              if f"{p['id']}.jpg" in have and os.environ.get("REPICTURE") != "true": continue
              url = ("https://image.pollinations.ai/prompt/" + urllib.parse.quote(p["prompt"]) +
                     f"?width=1280&height=720&seed={p['seed']}&nologo=true&model=flux")
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "BazaarTV-news/1.0"})
                      with urllib.request.urlopen(req, timeout=180) as r, open("pics/raw.jpg", "wb") as f: f.write(r.read())
                      im = Image.open("pics/raw.jpg").convert("RGB")
                      # Cut the bottom strip (where the free service may put its mark), back to 16:9.
                      im = im.crop((0, 0, im.width, int(im.height * 0.93)))
                      w = int(im.height * 16 / 9); x = (im.width - w) // 2
                      im.crop((max(0, x), 0, max(0, x) + min(w, im.width), im.height)).resize((1280, 720)).save(f"pics/{p['id']}.jpg", quality=94)
                      print("made", p["id"]); break
                  except Exception as e:
                      print("retry", p["id"], e); time.sleep(20 * (attempt + 1))
          EOF
          ls pics/*.jpg 2>/dev/null && gh release upload channel-media pics/presenter-*.jpg -R "$GITHUB_REPOSITORY" --clobber || echo "No new pictures"

  talk:
    needs: pictures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.pictures.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Get SadTalker
        run: |
          git clone -q https://github.com/OpenTalker/SadTalker st
      - uses: actions/cache@v4
        with:
          path: |
            st/checkpoints
            st/gfpgan/weights
          key: sadtalker-weights-v0.0.2
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 fonts-dejavu-core
          pip install -q torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "setuptools<70" numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 \
            librosa==0.9.2 numba resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml \
            joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors edge-tts pillow
          cd st && mkdir -p checkpoints gfpgan/weights
          get() { [ -s "$2/$(basename $1)" ] || curl -fsSL -o "$2/$(basename $1)" "https://github.com/$1"; }
          get OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00109-model.pth.tar checkpoints
          get OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00229-model.pth.tar checkpoints
          get OpenTalker/SadTalker/releases/download/v0.0.2-rc/SadTalker_V0.0.2_256.safetensors checkpoints
          get xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth gfpgan/weights
          get xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth gfpgan/weights
          get TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth gfpgan/weights
          get xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth gfpgan/weights
      - name: Make the talking sample
        env:
          ID: ${{ matrix.id }}
        run: |
          set -eu
          curl -fsSL -o face.jpg "https://github.com/$GITHUB_REPOSITORY/releases/download/channel-media/$ID.jpg"
          python3 - <<'EOF'
          import asyncio, json, edge_tts
          cfg = json.load(open("tools/news/presenters/presenters.json"))
          asyncio.run(edge_tts.Communicate(cfg["line"], cfg["voice"]).save("line.mp3"))
          EOF
          ffmpeg -loglevel error -y -i line.mp3 -ac 1 -ar 16000 line.wav
          cd st
          python inference.py --driven_audio ../line.wav --source_image ../face.jpg --result_dir ../res \
            --still --preprocess full --enhancer gfpgan --cpu 2>&1 | grep -v "it/s" | tail -20
          cd ..
          raw=$(ls res/*.mp4 | head -1)
          python3 tools/news/presenters/sample.py "$raw" line.mp3 "$ID" "news-sample-$ID.mp4"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload channel-media news-sample-${{ matrix.id }}.mp4 -R "$GITHUB_REPOSITORY" --clobber
