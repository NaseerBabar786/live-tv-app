name: Logo check

# docs/channel/logo-check.json: which videos on our YouTube-based channels carry another channel's logo
# (tools/logo_check.py; the owner's wish 2026-10-10: programmes with no other branding). Runs before
# the daily channel lists (build-youtube-channels.yml, 09:45 UTC), which keep only logo-free videos on
# the channels marked "clean"; only videos not checked before are looked at.
on:
  schedule:
    - cron: "5 9 * * *"   # every day, 09:05 UTC
  push:
    branches: [main]
    paths: [tools/logo_check.py, .github/workflows/logo-check.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Check the videos
        run: python3 tools/logo_check.py

      - name: Publish the results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/logo-check.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Logo check as of $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
