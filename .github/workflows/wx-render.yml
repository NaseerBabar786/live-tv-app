name: wx-render (temporary)
on:
  push:
    branches: [wx-render2]
permissions:
  contents: write
jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip render]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew -p wxrender run --no-daemon -q --args="$PWD/wxrender/forecast.json $PWD/wxrender/out"
      - run: |
          git config user.name claude; git config user.email noreply@anthropic.com
          git add wxrender/out && git commit -m "render [skip render]" && git push
