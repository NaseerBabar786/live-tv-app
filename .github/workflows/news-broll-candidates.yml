name: News clip candidates
# Contact sheets of free Wikimedia Commons videos so Claude can hand-pick neutral topic clips.
on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/news-broll-candidates.yml"]
jobs:
  sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow
          python3 tools/news/broll.py candidates cand "Islamabad" "Lahore" "Karachi" "Faisal Mosque" "Pakistan" \
            "cricket" "Delhi" "Mumbai" "India" "Toronto" "Ottawa" "Canada city" "city timelapse" "globe earth" \
            "rain" "clouds timelapse" "football soccer" "stadium" "cinema" "film projector" "Bollywood" "Hollywood" \
            "coins banknotes" "stock exchange" "market bazaar" "hospital" "courthouse" "gavel" "ballot box" "parliament building"
          gh release upload news-broll cand/* -R "$GITHUB_REPOSITORY" --clobber
