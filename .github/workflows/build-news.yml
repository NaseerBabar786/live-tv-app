name: Build news bulletins

# Bazaar TV News: every hour makes the bulletin due at the next full hour (Toronto time) and puts it
# on the "channel-media" pre-release under a FIXED name, so the channel schedule never changes:
#   news-headlines.mp4  3:00, plays every hour on the hour
#   news-full.mp4      10:00, plays at 00, 03, 06 ... 21 o'clock (made in the hour before)
# Urdu (Bazaar TV is an Urdu/Hindi channel). See tools/news/make_news.py. If a run fails, the last bulletin simply stays on air.

on:
  # Owner rule (2026-10-07): every bulletin is on the release at least 30 minutes before air time.
  # The :02 run makes the next hour's bulletin (ready by about :12); the :20 run only builds it if the
  # first one failed or never started, so a good bulletin is never replaced close to air time.
  schedule:
    - cron: "2 * * * *"
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "headlines, full, both, auto (the one due next) or probe (check feeds only)"
        required: false
        default: "auto"
  push:
    paths:
      - "tools/news/**"
      - ".github/workflows/build-news.yml"

concurrency:
  group: news-bulletins
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libraqm0 libfribidi0
          pip install -q edge-tts numpy pillow

      - name: Make the bulletins
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIND: ${{ github.event.inputs.kind || 'auto' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          mkdir -p out
          python3 -c "from PIL import features; assert features.check('raqm'), 'Urdu text needs raqm'"
          # A code change makes both, so both are fresh with the new look.
          if [ "$EVENT" = "push" ] || [ "$KIND" = "both" ]; then kinds="headlines full"; else kinds="$KIND"; fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%M)" -ge 15 ]; then
            read -r due slot <<< "$(python3 tools/news/make_news.py out --kind auto --due)"
            have=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/channel-media/news-$due.json" \
                   | python3 -c "import json,sys; print(json.load(sys.stdin).get('slot',''))" || true)
            if [ "$have" = "$slot" ]; then echo "news-$due for $slot is already up; nothing to do"; exit 0; fi
            echo "back-up run: news-$due for $slot is missing (have '$have'), building it now"
          fi
          for k in $kinds; do python3 tools/news/make_news.py out --kind "$k"; done
          ls -la out

      - name: Upload to the channel-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/news-*.mp4 >/dev/null 2>&1 || { echo "Nothing new to upload"; exit 0; }
          gh release view channel-media -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create channel-media -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Channel media" --notes "Videos for the owner's channel."
          gh release upload channel-media out/news-*.json $(ls out/news-*.mp4 2>/dev/null) -R "$GITHUB_REPOSITORY" --clobber
