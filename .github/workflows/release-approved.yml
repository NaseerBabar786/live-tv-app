name: Release approved build

# The owner's release rule: every build first goes to the owner-only "test" pre-release (see
# build-apk.yml). Nothing reaches users until the owner has tested it and said it is good. Then this
# workflow (run by hand, or by Claude after the owner's yes) copies the tested APKs from "test" to
# the public releases that the apps, the website and App Bazaar read. Apps then show a
# "New update available" reminder; they never update by themselves.
# App Bazaar's list (apps.bulkbazaar.ca/apps.json) follows within the hour (its sync job reads these
# public downloads), or at once by running "Sync app versions" in NaseerBabar786/app-store.
#
# The owner's one-release-per-day rule (2026-10-08): a yes that comes after the day's release is
# kept for the next day. mode "hold" copies the tested build from "test" into the owner-only
# "approved" pre-release (so new pushes to main can keep replacing "test"); the next day mode
# "release held build" publishes from "approved" exactly as "release now" publishes from "test".
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Which tested app(s) to send to everyone"
        type: choice
        default: cable-tv
        options:
          - cable-tv
          - live-tv-max
          - app-bazaar
          - iqra-quran
          - live-cam
          - multi-chat
          - notes-for-claude
          - cable-tv-pc
          - all
      build:
        description: "Only release if the test build is this build number (blank = the current test build)"
        required: false
        default: ""
      mode:
        description: "release now (from test) | hold (keep the approved test build for the next day) | release held build (from approved)"
        type: choice
        default: release now
        options:
          - release now
          - hold
          - release held build

permissions:
  contents: write

concurrency:
  group: release-approved
  cancel-in-progress: false

jobs:
  hold:
    if: inputs.mode == 'hold'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the tested build in "approved"
        run: |
          mkdir held && cd held
          gh release download test --pattern '*' --clobber
          want="${{ inputs.build }}"
          have=$(jq -r .build versions.json)
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            echo "::error::The test build is now $have, not $want. A newer build replaced the one that was tested; test it first."
            exit 1
          fi
          commit=$(jq -r .commit versions.json)
          gh release delete approved --cleanup-tag --yes 2>/dev/null || true
          gh release create approved * --prerelease --target "$commit" \
            --title "APPROVED build $have (Cable TV $(jq -r '."cable-tv"' versions.json)), waiting for its release day" \
            --notes "Owner-approved copy of TEST build $have from $commit (apps: ${{ inputs.apps }}). Published by this workflow with mode 'release held build'. Not sent to users yet."
          echo "Held test build $have in 'approved' for apps: ${{ inputs.apps }}." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: inputs.mode != 'hold'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPS: ${{ inputs.apps }}
      FROM: ${{ inputs.mode == 'release held build' && 'approved' || 'test' }}
    steps:
      - name: Download the tested build
        run: |
          gh release download "$FROM" --pattern '*' --clobber
          cat versions.json
          want="${{ inputs.build }}"
          have=$(jq -r .build versions.json)
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            echo "::error::The $FROM build is $have, not $want. A newer build replaced the one that was tested; test it first."
            exit 1
          fi
          echo "BUILD=$have" >> "$GITHUB_ENV"
          echo "COMMIT=$(jq -r .commit versions.json)" >> "$GITHUB_ENV"

      # Picked when APPS is the app's id or "all".
      - name: Cable TV
        if: inputs.apps == 'cable-tv' || inputs.apps == 'all'
        run: |
          version=$(jq -r '."cable-tv"' versions.json)
          tag="v${version}-build${BUILD}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" LiveTV.apk --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" LiveTV.apk \
              --title "Cable TV $version (build $BUILD)" \
              --notes "Tested and approved by the owner. Built from $COMMIT." \
              --target "$COMMIT" --latest
          fi

      # One fixed "live-tv-max" release; the app reads its version from the title ("Live TV Max 1.0.0").
      - name: Live TV Max
        if: inputs.apps == 'live-tv-max' || inputs.apps == 'all'
        run: |
          version=$(jq -r '."live-tv-max"' versions.json)
          if gh release view live-tv-max > /dev/null 2>&1; then
            gh release upload live-tv-max LiveTVMax.apk --clobber
          else
            gh release create live-tv-max LiveTVMax.apk --title "Live TV Max $version" --notes "Newest approved Live TV Max." --latest=false
          fi
          gh release edit live-tv-max --title "Live TV Max $version" --notes "Newest approved Live TV Max build (now $version), from $COMMIT."

      # One fixed "app-bazaar" release (Downloader code tv.bulkbazaar.ca/bazaar).
      - name: App Bazaar
        if: inputs.apps == 'app-bazaar' || inputs.apps == 'all'
        run: |
          version=$(jq -r '."app-bazaar"' versions.json)
          if gh release view app-bazaar > /dev/null 2>&1; then
            gh release upload app-bazaar AppBazaar.apk --clobber
          else
            gh release create app-bazaar AppBazaar.apk --title "App Bazaar $version" --notes "Newest approved App Bazaar." --latest=false
          fi
          gh release edit app-bazaar --title "App Bazaar $version" --notes "Newest approved App Bazaar build (now $version), from $COMMIT."

      # Per-version tag "<prefix>-v<version>" (the apps' update checks look for the highest one)
      # plus a fixed release whose link never changes (App Bazaar and the Downloader codes use it).
      - name: Iqra Quran, Live Cam, Multi Chat
        run: |
          publish() { # id prefix fixed file title
            [ "$APPS" = "$1" ] || [ "$APPS" = all ] || return 0
            version=$(jq -r --arg k "$1" '.[$k]' versions.json)
            tag="$2-v${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "$4" --clobber
            else
              gh release create "$tag" "$4" --title "$5 $version" --notes "Tested and approved. Built from $COMMIT." --latest=false
            fi
            if gh release view "$3" > /dev/null 2>&1; then
              gh release upload "$3" "$4" --clobber
            else
              gh release create "$3" "$4" --title "$5 (newest)" --notes "Newest approved $5." --latest=false
            fi
            gh release edit "$3" --notes "Newest approved $5 build (now $version), from $COMMIT." || true
          }
          publish iqra-quran iqra-quran iqra-quran IqraQuran.apk "Iqra Quran"
          publish live-cam livecam livecam LiveCam.apk "Live Cam"
          publish multi-chat multichat multichat MultiChat.apk "Multi Chat"

      # One fixed "claude-notes" release; the app reads its version from the title.
      - name: Notes for Claude
        if: inputs.apps == 'notes-for-claude' || inputs.apps == 'all'
        run: |
          version=$(jq -r '."notes-for-claude"' versions.json)
          if gh release view claude-notes > /dev/null 2>&1; then
            gh release upload claude-notes NotesForClaude.apk --clobber
          else
            gh release create claude-notes NotesForClaude.apk --title "Notes for Claude $version" --notes "Newest approved Notes for Claude." --latest=false
          fi
          gh release edit claude-notes --title "Notes for Claude $version" --notes "Newest approved Notes for Claude build (now $version), from $COMMIT."

      # Cable TV for PC (cabletv-pc/, build-cabletv-pc.yml): one fixed "cable-tv-pc" release; the app reads its
      # version from the title ("Cable TV for PC 1.0.0") and its update installs CableTV-PC-Setup.exe from it.
      # The version approved before goes to the "rollback" release, for the app's crash rollback.
      - name: Cable TV for PC
        if: inputs.apps == 'cable-tv-pc' || inputs.apps == 'all'
        run: |
          if [ ! -f versions-pc.json ] || [ ! -f CableTV-PC-Setup.exe ]; then
            if [ "$APPS" = cable-tv-pc ]; then echo "::error::There is no Cable TV for PC test build yet."; exit 1; fi
            echo "::warning::No Cable TV for PC test build; skipped."; exit 0
          fi
          version=$(jq -r '."cable-tv-pc"' versions-pc.json)
          pc_commit=$(jq -r .commit versions-pc.json)
          if ! gh release view rollback > /dev/null 2>&1; then
            echo '{}' > approved-empty.json
            gh release create rollback approved-empty.json --title "Last good versions (crash rollback)" \
              --notes "If a new version closes by itself on start, the apps offer to go back to these." --latest=false
          fi
          if gh release view cable-tv-pc > /dev/null 2>&1; then
            old=$(gh release view cable-tv-pc --json name -q .name)
            if [ "$old" != "Cable TV for PC $version" ]; then
              mkdir -p rbpc
              gh release download cable-tv-pc --pattern CableTV-PC-Setup.exe --dir rbpc --clobber && \
                gh release upload rollback rbpc/CableTV-PC-Setup.exe --clobber
            fi
            gh release upload cable-tv-pc CableTV-PC-Setup.exe CableTV-PC-Portable.exe --clobber
          else
            gh release create cable-tv-pc CableTV-PC-Setup.exe CableTV-PC-Portable.exe \
              --title "Cable TV for PC $version" --notes "Newest approved Cable TV for Windows." --latest=false
          fi
          gh release edit cable-tv-pc --title "Cable TV for PC $version" \
            --notes "Newest approved Cable TV for Windows (now $version), from $pc_commit. Setup installs it with Start menu and desktop shortcuts; Portable runs without installing."

      # Crash rollback: this test build came with the previously approved version of each app rebuilt
      # with a higher version code (Rollback-*.apk). Users of the version approved now go back to that
      # one if it closes by itself on start. approved.json records this approval for the next rollbacks.
      - name: Rollback copies
        run: |
          gh release download rollback --pattern approved.json --clobber 2>/dev/null || echo '{}' > approved.json
          for pair in cable-tv:LiveTV.apk live-tv-max:LiveTVMax.apk app-bazaar:AppBazaar.apk iqra-quran:IqraQuran.apk \
                      live-cam:LiveCam.apk multi-chat:MultiChat.apk notes-for-claude:NotesForClaude.apk; do
            id=${pair%%:*}; apk=${pair#*:}
            [ "$APPS" = "$id" ] || [ "$APPS" = all ] || continue
            jq --arg k "$id" --arg c "$COMMIT" '.[$k] = $c' approved.json > a.tmp && mv a.tmp approved.json
            if [ -f "Rollback-$apk" ]; then
              mkdir -p rb && cp "Rollback-$apk" "rb/$apk"
            else
              echo "::warning::No rollback copy of $id in this test build."
            fi
          done
          cat approved.json
          if ! gh release view rollback > /dev/null 2>&1; then
            gh release create rollback approved.json --title "Last good versions (crash rollback)" \
              --notes "If a new version closes by itself on start, the apps offer to go back to these." --latest=false
          fi
          gh release upload rollback approved.json --clobber
          if ls rb/*.apk > /dev/null 2>&1; then gh release upload rollback rb/*.apk --clobber; fi

      - name: Summary
        run: |
          echo "Released ($APPS) from $FROM build $BUILD. Apps show 'New update available' on their next start." | tee -a "$GITHUB_STEP_SUMMARY"
