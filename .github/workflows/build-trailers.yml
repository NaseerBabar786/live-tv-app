name: Build trailers and music videos

# docs/channel/trailers.json and music-videos.json: Bazaar TV's blocks of upcoming film trailers (English,
# Hindi, Punjabi, Pakistani) and popular music videos (English, Hindi, Urdu, Punjabi) from the studios',
# labels' and artists' own YouTube channels, rebuilt every day. Played in
# YouTube's player, locked, on tv.bulkbazaar.ca/channel/block.html (also in the app).
on:
  schedule:
    - cron: "30 8 * * *"   # every day, 08:30 UTC
  push:
    branches: [main]
    paths: [tools/build_trailers.py, tools/build_music_videos.py, tools/build_bazaar_blocks.py, .github/workflows/build-trailers.yml]
  pull_request:
    paths: [tools/build_trailers.py, tools/build_music_videos.py, tools/build_bazaar_blocks.py, .github/workflows/build-trailers.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-trailers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the trailers
        run: python3 tools/build_trailers.py

      - name: Build the music videos
        if: always()
        run: python3 tools/build_music_videos.py

      - name: Pick the day's programme blocks
        if: always()
        run: python3 tools/build_bazaar_blocks.py

      - name: Publish the lists
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/trailers.json docs/channel/music-videos.json docs/channel/block-*.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Trailers and music videos as of $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
