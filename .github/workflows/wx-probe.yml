name: wx probe
on:
  push:
    branches: [wx-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://api.open-meteo.com/v1/forecast?latitude=44.1&longitude=-77.58&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,uv_index,visibility,cloud_cover,dew_point_2m&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,is_day,wind_speed_10m,uv_index,pressure_msl&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,snowfall_sum,sunrise,sunset,uv_index_max,wind_speed_10m_max,wind_gusts_10m_max&timezone=auto"
          for extra in "&minutely_15=precipitation&past_minutely_15=1&forecast_minutely_15=12&forecast_days=16&past_days=14" "&forecast_days=16&past_days=14" "&minutely_15=precipitation&forecast_minutely_15=12&forecast_days=16&past_days=14" "&minutely_15=precipitation&past_minutely_15=1&forecast_minutely_15=12&forecast_days=10"; do
            echo "== $extra"; curl -s -w ' HTTP %{http_code} size %{size_download}\n' "$B$extra" | tail -c 400; echo
          done
          echo "== air"; curl -s "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=44.1&longitude=-77.58&current=us_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen" | head -c 600; echo
          echo "== rainviewer"; curl -s https://api.rainviewer.com/public/weather-maps.json | head -c 600; echo
          echo "== bing"; curl -s -A "Mozilla/5.0" "https://www.bing.com/news/search?q=Quinte+West+weather&format=rss&setmkt=en-CA&setlang=en" | head -c 1500; echo
          echo "== videos"; curl -s https://tv.bulkbazaar.ca/weather/videos.json | head -c 400
