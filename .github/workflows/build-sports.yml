name: Build Bazaar Sports schedule

# Builds docs/channel/sports-schedule.json (tv.bulkbazaar.ca/channel/sports-schedule.json): the
# ready-made schedule of Bazaar Sports, our sports channel (000000 in Free Live TV), from
# public-domain and CC BY sports films on the Internet Archive. A new loop order every week.
on:
  schedule:
    - cron: "30 12 * * 1"   # Mondays, 12:30 UTC
  push:
    branches: [main]
    paths: [tools/build_sports.py, .github/workflows/build-sports.yml]
  pull_request:
    paths: [tools/build_sports.py, .github/workflows/build-sports.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-sports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the schedule
        run: python3 tools/build_sports.py

      # A push made with the workflow's own token doesn't start other workflows,
      # so the website is rebuilt explicitly below.
      - name: Publish the schedule
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channel/sports-schedule.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Bazaar Sports schedule for the week of $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build."
