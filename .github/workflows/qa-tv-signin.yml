name: QA TV sign-in with the remote

# Signs in on an Android TV emulator with remote keys only, with the release APK and with this
# branch's build, sending keys both as a keyboard and as a TV remote's D-pad. Screenshots and the
# cursor position after every key go to the qa-results pre-release (tv-signin-*.zip).
on:
  workflow_dispatch:
  push:
    branches: ['qa/tv-signin']

concurrency:
  group: qa-tv-signin
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build this branch (with sign-in)
        env:
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: ./gradlew assembleLivetvDebug
      - name: Download the release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern LiveTV.apk --dir rel
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash tools/qa/tv_signin.sh out/fixed-dpad app/build/outputs/apk/livetv/debug/app-livetv-debug.apk dpad qa-tv-signin@bulkbazaar.ca qatest2026
            bash tools/qa/tv_signin.sh out/fixed-keyboard app/build/outputs/apk/livetv/debug/app-livetv-debug.apk keyboard qa-tv-signin@bulkbazaar.ca qatest2026
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && for d in */; do d=${d%/}; zip -qr "../tv-signin-$d.zip" "$d"; done; cd ..
          cat out/*/steps.txt > tv-signin-steps.txt || true
          gh release upload qa-results tv-signin-*.zip tv-signin-steps.txt --clobber --repo "$GITHUB_REPOSITORY"
