<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cable TV Solitaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-screen card table. Glass score chips on top, 7-column board, floating glass dock at the bottom.
   Deliberate single look (lit card table at night), so no light/dark switch. */
:root{
  --t1:#11a36b; --t2:#0a6b4d; --t3:#04291f;           /* table: centre light, mid, edge */
  --ink:#ffffff; --ink-soft:rgba(255,255,255,.66);
  --card1:#ffffff; --card2:#f1efe9;
  --red:#e8364a; --red2:#b3122f; --blk:#1b2236; --blk2:#3b4766;
  --bk1:#3b82f6; --bk2:#1e3a8a;                       /* card back */
  --gold1:#ffe08a; --gold2:#f5a524;
  --glass:rgba(6,20,16,.42); --glass-line:rgba(255,255,255,.14);
  --f:"Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--t3);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box;position:relative;
  background:
    radial-gradient(60% 45% at 50% 30%, rgba(255,255,255,.16), transparent 70%),
    radial-gradient(130% 95% at 50% 32%, var(--t1) 0%, var(--t2) 48%, var(--t3) 100%)}
#app.t-blue{--t1:#2f7fe0;--t2:#14468f;--t3:#061a3a}
#app.t-purple{--t1:#8b5cf6;--t2:#4c1d95;--t3:#1a0838}
#app.t-wine{--t1:#d1405a;--t2:#7a1530;--t3:#2c0510}
#app.t-slate{--t1:#55657a;--t2:#28323f;--t3:#0b0f15}
#app.b-purple{--bk1:#a855f7;--bk2:#5b21b6}
#app.b-red{--bk1:#f43f5e;--bk2:#881337}
#app.b-black{--bk1:#475569;--bk2:#0f172a}
#noise{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.55)}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 6px;position:relative;z-index:2}
.chips{display:flex;gap:10px;flex:1;justify-content:center;min-width:0}
.chip{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 10px;border-radius:16px;background:var(--glass);
  border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:0}
.chip i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.chip i svg{width:18px;height:18px}
.chip b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.chip span{display:block;font-size:clamp(18px,2.4vw,26px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.chip.score i{background:linear-gradient(135deg,#ffd166,#f59e0b)} .chip.time i{background:linear-gradient(135deg,#67e8f9,#3b82f6)} .chip.moves i{background:linear-gradient(135deg,#f9a8d4,#a855f7)}
.chip span.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25);color:var(--gold1)}}
.round{width:46px;height:46px;border-radius:15px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.round svg{width:24px;height:24px}
.round:focus-visible,.dock button:focus-visible,.panel button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#autoBtn{opacity:.4;transition:opacity .2s}
#autoBtn.ready{opacity:1;background:linear-gradient(135deg,#34d399,#059669);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(52,211,153,.25)}}

#board{flex:1;position:relative;min-height:0;touch-action:none;z-index:1}
.slot{position:absolute;left:0;top:0;border-radius:calc(var(--cw)*.1px);box-sizing:border-box}
.slot.found{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;box-shadow:inset 0 2px 12px rgba(0,0,0,.18)}
.slot.found svg{width:44%;height:44%;color:rgba(255,255,255,.22)}
.slot.tab{border:2px dashed rgba(255,255,255,.14);display:grid;place-items:center;color:rgba(255,255,255,.16);font-weight:800;font-size:calc(var(--cw)*.4px)}
.slot.waste{border:2px solid rgba(255,255,255,.06);background:rgba(0,0,0,.06)}
.slot.stock{border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.14);display:grid;place-items:center;cursor:pointer}
.slot.stock svg{width:42%;height:42%;opacity:.75}
.slot.hint{box-shadow:0 0 0 3px var(--gold1),0 0 24px var(--gold2)}

.card{position:absolute;left:0;top:0;border-radius:.1em;transition:transform .24s cubic-bezier(.2,.8,.25,1);will-change:transform;cursor:pointer}
#board.noanim .card{transition:none}
.card>div{position:absolute;inset:0;border-radius:inherit;box-shadow:0 .015em .03em rgba(0,0,0,.25),0 .06em .14em rgba(0,0,0,.22)}
.face{background:linear-gradient(180deg,var(--card1),var(--card2));overflow:hidden}
.face::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 .02em 0 rgba(255,255,255,.9);pointer-events:none;z-index:2}
.card.down .face,.card:not(.down) .back{display:none}
.rk{position:absolute;left:.075em;top:.03em;font:800 .34em/1 var(--f);letter-spacing:-.04em}
.rk.ten{letter-spacing:-.09em;left:.05em}
.cs{position:absolute;right:.075em;top:.07em;width:.22em;height:.22em}
.big{position:absolute;left:50%;bottom:.12em;width:.56em;height:.56em;transform:translateX(-50%);filter:drop-shadow(0 .02em .02em rgba(0,0,0,.18))}
.face.red{color:var(--red)} .face.blk{color:var(--blk)}
.face.red .big{color:var(--red)} 
.court{position:absolute;left:.09em;right:.09em;top:.4em;bottom:.09em;border-radius:.07em;display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;color:#fff;box-shadow:inset 0 0 0 .015em rgba(255,255,255,.35)}
.face.red .court{background:linear-gradient(150deg,#ff6b7d 0%,var(--red) 45%,var(--red2) 100%)}
.face.blk .court{background:linear-gradient(150deg,#5b6a93 0%,var(--blk2) 40%,var(--blk) 100%)}
.court::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 .02em,transparent .02em .07em)}
.court::after{content:"";position:absolute;left:-30%;top:-60%;width:90%;height:120%;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 60%);transform:rotate(8deg)}
.court i{font:900 .44em/0.95 var(--f);font-style:normal;position:relative;text-shadow:0 .02em .04em rgba(0,0,0,.3)}
.court svg{width:.2em;height:.2em;position:relative;margin-top:.02em}
.court .crown{width:.26em;height:.12em;color:var(--gold1);filter:drop-shadow(0 .01em .01em rgba(0,0,0,.35));margin:0 0 .02em}
.back{background:
   radial-gradient(circle at 50% 50%,rgba(255,255,255,.18) 0 .018em,transparent .02em) 0 0/.09em .09em,
   linear-gradient(145deg,var(--bk1),var(--bk2));
  box-shadow:inset 0 0 0 .04em rgba(255,255,255,.92),inset 0 0 0 .055em rgba(0,0,0,.15),0 .015em .03em rgba(0,0,0,.25),0 .06em .14em rgba(0,0,0,.22)!important;overflow:hidden}
.back::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 38%)}
.back::after{content:"";position:absolute;left:50%;top:50%;width:.3em;height:.3em;margin:-.15em 0 0 -.15em;border-radius:.08em;transform:rotate(45deg);
  background:radial-gradient(circle,var(--bk2) 0 22%,transparent 24%),linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 .02em .05em rgba(0,0,0,.35),inset 0 0 0 .015em rgba(255,255,255,.6)}
.card:not(.down):hover>div{box-shadow:0 .015em .03em rgba(0,0,0,.25),0 .1em .22em rgba(0,0,0,.28)}
.card.stk>div{box-shadow:none!important}.card.stk .back{box-shadow:inset 0 0 0 .04em rgba(255,255,255,.92)!important}
.card.hint>div{box-shadow:0 0 0 .03em var(--gold1),0 0 .25em var(--gold2)!important}
.card.held>div{box-shadow:0 0 0 .035em #fff,0 0 .25em rgba(120,220,255,.9),0 .14em .28em rgba(0,0,0,.45)!important}
.card.drag>div{box-shadow:0 .16em .34em rgba(0,0,0,.45)!important}
.card.drag{transform-origin:50% 20%}
.card.flip>div{animation:flip .3s ease-out}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:none}}
.card.shake>div{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-.05em)}50%{transform:translateX(.05em)}75%{transform:translateX(-.03em)}}
.card.land>div{animation:land .45s}
@keyframes land{30%{box-shadow:0 0 0 .03em var(--gold1),0 0 .35em var(--gold2)}}

.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:6000;background:var(--gold1);box-shadow:0 0 8px var(--gold2);animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.plus{position:absolute;z-index:6001;pointer-events:none;font:900 22px var(--f);color:var(--gold1);text-shadow:0 2px 6px rgba(0,0,0,.5);animation:plus .9s ease-out forwards}
@keyframes plus{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.1);opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}

#cursor{position:absolute;left:0;top:0;border:4px solid #fff;border-radius:12px;pointer-events:none;z-index:5000;
  box-shadow:0 0 0 2px rgba(0,0,0,.3),0 0 22px rgba(255,255,255,.75);transition:transform .14s,width .14s,height .14s;display:none}
#app.keys #cursor{display:block}
#app.keys.dockrow #cursor{display:none}
.kfocus{outline:3px solid #fff!important;outline-offset:3px;box-shadow:0 0 18px rgba(255,255,255,.7)!important}

.dock{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.3);
  padding:8px 10px;margin-block:6px 12px;position:relative;z-index:2;max-width:640px;width:100%;align-self:center;box-sizing:border-box}
.dock button{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:700 clamp(11px,1.4vw,14px)/1.1 var(--f);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px;border-radius:14px;cursor:pointer;transition:transform .15s}
.dock button:hover{transform:translateY(-2px)}
.dock button:disabled{opacity:.35;cursor:default;transform:none}
.dock .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.dock .ic svg{width:22px;height:22px}
#setBtn .ic{background:linear-gradient(135deg,#94a3b8,#475569)} #replayBtn .ic{background:linear-gradient(135deg,#38bdf8,#2563eb)}
#hintBtn .ic{background:linear-gradient(135deg,#fde047,#f59e0b)} #undoBtn .ic{background:linear-gradient(135deg,#fb7185,#e11d48)}
.dock .main .ic{width:58px;height:58px;border-radius:19px;margin-top:-24px;background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 8px 20px rgba(245,165,36,.45),inset 0 1px 0 rgba(255,255,255,.6);border:3px solid rgba(255,255,255,.85)}
.dock .main .ic svg{width:32px;height:32px}
#keysHelp{text-align:center;font-size:12px;color:var(--ink-soft);margin:-6px 0 8px;position:relative;z-index:2}
@media (max-width:700px){#keysHelp{display:none}.chip{padding:6px 10px 6px 6px;gap:6px}.chip i{width:24px;height:24px;border-radius:8px}.chip i svg{width:14px;height:14px}.chips{gap:6px}.round{width:40px;height:40px}}
@media (max-width:460px){.chip i{display:none}.chip{padding:6px 10px}}

#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,-10px);background:rgba(10,16,24,.82);backdrop-filter:blur(8px);padding:12px 22px;border-radius:16px;border:1px solid var(--glass-line);
  font-weight:700;font-size:17px;opacity:0;transition:.25s;pointer-events:none;z-index:9000;max-width:calc(100% - 48px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;z-index:7000;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:8000;padding:16px}
.panel{background:linear-gradient(180deg,rgba(28,40,52,.96),rgba(14,20,28,.97));border:1px solid var(--glass-line);border-radius:24px;padding:22px 24px;
  width:min(440px,100%);box-sizing:border-box;box-shadow:0 30px 60px rgba(0,0,0,.5);max-height:90vh;overflow:auto;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}}
.panel h2{font:800 30px/1.1 var(--f);margin:0 0 14px;text-align:center}
.panel h2.win{font-size:40px;background:linear-gradient(90deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  color:var(--ink);font:700 15px var(--f);cursor:pointer}
.seg button.on{border-color:var(--gold1);background:rgba(255,224,138,.12)}
.sw{width:18px;height:18px;border-radius:6px;display:inline-block;vertical-align:-4px;margin-right:6px;border:1px solid rgba(255,255,255,.5)}
.rows{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){font-weight:800;text-align:right}
.rows .total{border-top:1px solid rgba(255,255,255,.2);padding-top:8px;font-size:20px;color:var(--gold1)}
.cta{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#2a1700;font:800 18px var(--f);cursor:pointer;box-shadow:0 8px 20px rgba(245,165,36,.35)}
.cta.ghost{background:rgba(255,255,255,.08);color:var(--ink);margin-top:10px;box-shadow:none}
.help{font-size:14px;line-height:1.5;color:var(--ink-soft)}
.help kbd{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px;font:700 13px var(--f);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.flip>div,.card.land>div,#autoBtn.ready{animation:none}}
@media (max-height:540px){header{padding-block:4px 0}.chip span{font-size:18px}.dock{margin-block:2px 6px;padding:4px 8px}.dock .ic{width:32px;height:32px}.dock .main .ic{width:44px;height:44px;margin-top:-12px}#keysHelp{display:none}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="s0" viewBox="0 0 100 100"><path fill="currentColor" d="M50 4C50 4 8 38 8 62c0 16 14 25 27 21 6-2 10-6 12-10-1 10-5 18-12 23h30c-7-5-11-13-12-23 2 4 6 8 12 10 13 4 27-5 27-21C92 38 50 4 50 4z"/></symbol>
    <symbol id="s1" viewBox="0 0 100 100"><path fill="currentColor" d="M50 93C50 93 5 61 5 32 5 16 17 6 30 6c9 0 16 5 20 14 4-9 11-14 20-14 13 0 25 10 25 26 0 29-45 61-45 61z"/></symbol>
    <symbol id="s2" viewBox="0 0 100 100"><path fill="currentColor" d="M50 3Q66 28 88 50 66 72 50 97 34 72 12 50 34 28 50 3z"/></symbol>
    <symbol id="s3" viewBox="0 0 100 100"><path fill="currentColor" d="M50 6a21 21 0 1 1 0 42 21 21 0 1 1 0-42zM27 38a21 21 0 1 1 0 42 21 21 0 1 1 0-42zM73 38a21 21 0 1 1 0 42 21 21 0 1 1 0-42zM45 55h10c0 18 4 29 15 40H30c11-11 15-22 15-40z"/></symbol>
    <symbol id="crown" viewBox="0 0 60 28"><path fill="currentColor" d="M2 26 6 6l12 10L30 2l12 14L54 6l4 20z"/></symbol>
  </defs>
</svg>

<div id="app">
  <canvas id="noise"></canvas>
  <header>
    <button class="round" id="statsBtn" aria-label="Your records" title="Your records">
      <svg viewBox="0 0 24 24"><path fill="#ffd166" d="M7 3h10v2h3v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V5h3zm-1 4v1a3 3 0 0 0 1.4 2.5A8 8 0 0 1 7 8V7zm11 0v1a8 8 0 0 1-.4 2.5A3 3 0 0 0 18 8V7z"/></svg>
    </button>
    <div class="chips">
      <div class="chip score"><i><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg></i><div><b>Score</b><span id="score">0</span></div></div>
      <div class="chip time"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 9v4l3 2M9 2h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></i><div><b>Time</b><span id="time">0:00</span></div></div>
      <div class="chip moves"><i><svg viewBox="0 0 24 24"><path d="M5 9h11l-3-3M19 15H8l3 3" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></i><div><b>Moves</b><span id="moves">0</span></div></div>
    </div>
    <button class="round" id="autoBtn" aria-label="Finish automatically" title="Finish automatically">
      <svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.5l5 5L19.5 6"/></svg>
    </button>
  </header>
  <div id="board"><div id="cursor"></div></div>
  <nav class="dock">
    <button id="setBtn"><span class="ic"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></span>Settings</button>
    <button id="replayBtn"><span class="ic"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></span>Restart</button>
    <button id="newBtn" class="main"><span class="ic"><svg viewBox="0 0 32 32"><rect x="4" y="7" width="13" height="18" rx="2.5" fill="#7c2d12" opacity=".55" transform="rotate(-14 10 16)"/><rect x="15" y="7" width="13" height="18" rx="2.5" fill="#7c2d12" opacity=".55" transform="rotate(14 22 16)"/><rect x="9.5" y="5" width="13" height="19" rx="2.5" fill="#fff"/><path d="M16 10l3 4.5-3 4.5-3-4.5z" fill="#e8364a"/></svg></span>New game</button>
    <button id="hintBtn"><span class="ic"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><rect x="8.5" y="18" width="7" height="2" rx="1" fill="#fff"/><rect x="9.5" y="21" width="5" height="1.6" rx=".8" fill="#fff"/></svg></span>Hint</button>
    <button id="undoBtn"><span class="ic"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6L4 11l5 5M4.5 11H14a6 6 0 0 1 0 12h-2" transform="translate(0 -2)"/></svg></span>Undo</button>
  </nav>
  <div id="keysHelp">Keyboard or TV remote: arrows move, Enter picks up and drops, Esc cancels, H hint, U undo</div>
</div>
<canvas id="fx"></canvas>
<div id="toast" role="status"></div>
<div id="overlay"></div>

<script src="solitaire.js"></script>

</body>
</html>
