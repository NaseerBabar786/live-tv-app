<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" role="img" aria-label="Drawing of the Onn 4K streaming box and its remote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2346C8"/><stop offset="1" stop-color="#1A2F86"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#16181d"/></linearGradient>
  </defs>
  <rect width="280" height="420" rx="18" fill="url(#bg)"/>
  <text x="140" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="58" fill="#fff" letter-spacing="-2">onn</text>
  <text x="140" y="104" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="#9FD3FF">4K Streaming Box</text>
  <!-- box -->
  <ellipse cx="128" cy="262" rx="92" ry="16" fill="#000" opacity=".35"/>
  <path d="M48 190 L128 160 L208 190 L208 238 L128 268 L48 238 Z" fill="#101216"/>
  <path d="M48 190 L128 160 L208 190 L128 220 Z" fill="url(#top)"/>
  <path d="M128 220 L208 190 L208 238 L128 268 Z" fill="#0b0c0f"/>
  <text x="128" y="196" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" fill="#8a8f9a" transform="rotate(-2 128 196)">onn</text>
  <circle cx="160" cy="243" r="2.5" fill="#7BD88F"/>
  <!-- remote -->
  <rect x="210" y="200" width="36" height="150" rx="18" fill="#1b1d22" stroke="#3a3f4b" stroke-width="2"/>
  <circle cx="228" cy="235" r="11" fill="none" stroke="#6b7180" stroke-width="3"/>
  <circle cx="228" cy="235" r="4" fill="#6b7180"/>
  <circle cx="220" cy="265" r="4" fill="#6b7180"/><circle cx="236" cy="265" r="4" fill="#6b7180"/>
  <circle cx="220" cy="283" r="4" fill="#6b7180"/><circle cx="236" cy="283" r="4" fill="#6b7180"/>
  <rect x="219" y="300" width="18" height="30" rx="9" fill="#2b2f37"/>
  <text x="140" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="20" fill="#fff">Google TV</text>
</svg>
