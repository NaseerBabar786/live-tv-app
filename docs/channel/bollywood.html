<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar Hits · Watch live</title>
<meta name="description" content="Bazaar Hits: film songs round the clock, from the music labels' own YouTube channels.">
<meta property="og:image" content="https://tv.bulkbazaar.ca/channel/logos/bazaar-hits.png">
<link rel="icon" href="logos/bazaar-hits-square.png">
<style>
  /* Plays the music labels' own YouTube uploads in YouTube's player, one after another, like a
     channel. Opened full screen by the Cable TV app (?app=1) and linked from /channel. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Like a TV channel: nobody can pause, skip or open YouTube from the picture. A clear sheet
     over the player takes every click and tap; YouTube's own buttons are switched off below. */
  #player, iframe#player { pointer-events: none; }
  .shield { position: absolute; inset: 0; background: transparent; }
  .bug { position: absolute; top: 3%; right: 2.5%; height: 9vw; max-width: 26vw; object-fit: contain; opacity: .55; pointer-events: none; }
  .now { position: absolute; left: 3%; bottom: calc(var(--strip) + 5%); max-width: 70%; background: rgba(16,24,39,.85); color: #fff; padding: .6em 1em; border-radius: 10px; font-weight: 700; font-size: clamp(13px, 2.2vw, 26px); transition: opacity .6s; }
  .now small { display: block; font-weight: 400; opacity: .8; font-size: .7em; }
  .hide { opacity: 0; }
  .sound, .back { position: absolute; top: 3%; left: 2.5%; padding: .6em 1em; border-radius: 999px; border: 0; background: #E53935; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .back { left: auto; right: 30%; background: rgba(16,24,39,.85); text-decoration: none; }
  /* The scrolling line sits in its own strip under the picture, never over YouTube's player
     (YouTube's rules); the player, its cover and the clear sheet stop just above it. */
  :root { --strip: clamp(22px, 3.4vw, 40px); }
  #player, .cover, .shield { top: 0; bottom: auto !important; height: calc(100% - var(--strip)) !important; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); line-height: var(--strip); background: #101827; color: #fff; overflow: hidden; white-space: nowrap; font-size: clamp(12px, 1.8vw, 22px); pointer-events: none; }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 40s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; text-align: center; padding: 20px; }
  .diag { position: absolute; left: 3%; top: 12%; max-width: 70%; background: rgba(229,57,53,.9); color: #fff; padding: .5em .9em; border-radius: 8px; font-size: clamp(12px, 1.6vw, 20px); pointer-events: none; }
  /* Our own black card over the player until the video really plays: no YouTube loading screen or logo first. */
  .cover { position: absolute; inset: 0; background: #000; display: grid; place-items: center; transition: opacity .4s; pointer-events: none; }
  .cover img { height: 22vh; max-width: 50vw; object-fit: contain; opacity: .9; }
  .cover.off { opacity: 0; }
  .bug.tl { right: auto; left: 2.5%; }
  .bug.br { top: auto; bottom: 12%; }
  .bug.bl { top: auto; bottom: 12%; right: auto; left: 2.5%; }
</style>
</head>
<body>
<div id="player"></div>
<div class="cover" id="cover"><img alt="" src="logos/bazaar-hits.png"></div>
<div class="shield" id="shield"></div>
<img class="bug" src="logos/bazaar-hits.png" alt="">
<div class="now hide" id="now"></div>
<button class="sound" id="sound" hidden>🔊 Tap for sound</button>
<a class="back" id="back" href="./" hidden>Our channels</a>
<div class="ticker"><span>Bazaar Hits · Film songs, day and night, from the music labels' own channels · Channel 4 on Cable TV · Advertise with us: WhatsApp 437 602 6500 · tv.bulkbazaar.ca/advertise</span></div>
<div class="msg" id="msg">Loading Bazaar Hits…</div>
<script src="promo.js"></script>
<script>
const app = new URLSearchParams(location.search).has("app");
const $ = id => document.getElementById(id);
if (!app) { $("back").hidden = false; }
let songs = [], at = 0, player = null, nowTimer = null;

// Everyone joins the same running order: shuffled the same way each day, at a place set by the clock.
function shuffled(list, seed) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = Math.floor(seed / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Our logo never sits on the uploader's own logo (the owner's rule): logo-corners.json says which corner is free.
let corners = { default: "tr", labels: {} }, bugLabel = null;
fetch("logo-corners.json", { cache: "no-store" }).then(r => r.json()).then(c => { corners = c; placeBug(bugLabel); }).catch(() => {});
function placeBug(label) {
  bugLabel = label;
  const corner = corners.labels?.[label] || corners.default || "tr";
  document.querySelector(".bug").className = "bug " + corner;
}
function showNow() {
  const s = songs[at];
  placeBug(s.label);
  $("now").innerHTML = "<span></span><small></small>";
  $("now").firstChild.textContent = s.title;
  $("now").lastChild.textContent = "Bazaar Hits · " + s.label;
  $("now").classList.remove("hide");
  clearTimeout(nowTimer);
  nowTimer = setTimeout(() => $("now").classList.add("hide"), 8000);
}
function play(step = 0) {
  at = (at + step + songs.length) % songs.length;
  cover(true);
  player.loadVideoById(songs[at].id);
  showNow();
}
fetch("bollywood.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  const day = Math.floor(Date.now() / 86400000);
  songs = shuffled(d.songs, day);
  // About four minutes a song.
  const mins = (Date.now() % 86400000) / 60000;
  at = Math.floor(mins / 4) % songs.length;
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}).catch(() => { $("msg").textContent = "Bazaar Hits can't load right now. Please try again in a minute."; });

// When YouTube hasn't started after 15 s, the screen says why (a photo of it tells us what to fix).
let started = false, lastError = null, lastState = "none";
setTimeout(() => {
  if (started) return;
  const d = document.createElement("div");
  d.className = "diag";
  d.textContent = `YouTube didn't start here (${lastError ? "error " + lastError : "state " + lastState}) · ${(navigator.userAgent.match(/Chrome\/[\d.]+/) || ["?"])[0]}`;
  document.body.appendChild(d);
}, 15000);
// The cover goes once the video is really playing, and comes back while the next one loads.
let coverTimer = null;
function cover(on) {
  clearTimeout(coverTimer);
  if (on) $("cover").classList.remove("off");
  // 3.5 s after it starts, when YouTube's own title, logo and buttons at the start have faded away.
  else coverTimer = setTimeout(() => $("cover").classList.add("off"), 3500);
}
window.onYouTubeIframeAPIReady = () => {
  $("msg").remove();
  player = new YT.Player("player", {
    videoId: songs[at].id,
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0, origin: location.origin },
    events: {
      onReady: e => {
        // YouTube's own leveling leaves videos a little louder than Cable TV's leveled channels;
        // 60% brings them to the same loudness, so switching channels keeps one volume.
        e.target.setVolume(60);
        if (!app) { e.target.mute(); $("sound").hidden = false; }
        e.target.playVideo();
        showNow();
      },
      // It never stays paused: a channel keeps playing.
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) cover(false);
        else if (e.data === YT.PlayerState.BUFFERING || e.data === YT.PlayerState.UNSTARTED) cover(true);
        lastState = e.data;
        if (e.data === YT.PlayerState.PLAYING) started = true;
        // Between two videos, now and then, our own Cable TV promo (promo.js).
        if (e.data === YT.PlayerState.ENDED) promoBreak(e.target.isMuted(), () => play(1));
        else if (e.data === YT.PlayerState.PAUSED) e.target.playVideo();
      },
      // A video its label won't let others play here is skipped.
      onError: e => { lastError = e.data; setTimeout(() => play(1), 1000); },
    },
  });
};
$("sound").onclick = () => { player.unMute(); player.playVideo(); $("sound").hidden = true; };
// A tap or OK only shows what's playing; the songs run on by themselves, like a TV channel.
$("shield").onclick = () => songs.length && showNow();
// Double-click for full screen (YouTube's own button is off).
$("shield").ondblclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
document.addEventListener("keydown", e => {
  if (!player || !songs.length) return;
  if (e.key === "Enter" || e.key === " ") { showNow(); e.preventDefault(); }
  if (e.key === "MediaPlayPause" || e.key === "MediaPause" || e.key === "k") e.preventDefault();
});
</script>
</body>
</html>
