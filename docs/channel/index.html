<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark TV · Watch live</title>
<meta name="description" content="Watch our channel live, free, on Cable TV.">
<meta property="og:image" content="https://tv.bulkbazaar.ca/channel/logos/spark-tv.png">
<link rel="icon" href="logos/spark-tv-square.png" id="favicon">
<link rel="stylesheet" href="../assets/site.css">
<style>
  .stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .stage .bug { position: absolute; height: 12%; width: auto; max-width: 19.5%; object-fit: contain; opacity: .55; pointer-events: none; }
  .bug.tr { top: 3%; right: 2.5%; } .bug.tl { top: 3%; left: 2.5%; } .bug.br { bottom: 9%; right: 2.5%; } .bug.bl { bottom: 9%; left: 2.5%; }
  .stage .ticker { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(16,24,39,.9); color: #fff; font-weight: 700; overflow: hidden; white-space: nowrap; font-size: clamp(12px, 2vw, 22px); padding: .35em 0; }
  .ticker span { display: inline-block; padding-left: 100%; animation: crawl 28s linear infinite; }
  @keyframes crawl { to { transform: translateX(-100%); } }
  .stage .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #fff; font-size: 20px; }
  .stage .sound { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .stage:fullscreen { border-radius: 0; }
  .now { display: flex; gap: 14px; align-items: center; margin: 14px 0 6px; flex-wrap: wrap; }
  .now img { width: 120px; height: 56px; object-fit: contain; }
  .now b { font-size: 20px; }
  .live { background: var(--red); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
  .guide { display: grid; gap: 6px; }
  .guide div { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--surface-2); border-radius: 10px; }
  .guide div.cur { border-color: var(--focus); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .tabs a { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 2px solid var(--surface-2); background: var(--surface); color: var(--text); text-decoration: none; font-weight: 700; }
  .tabs a.sel { border-color: var(--focus); }
  .tabs img { width: 76px; height: 32px; object-fit: contain; }
  .guide .t { font-weight: 700; } .guide .l { color: var(--muted); font-size: 14px; }
  @media (min-width: 1200px) {
    main.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: auto auto auto auto auto auto 1fr; column-gap: 28px; align-items: start; }
    main.wrap > .tabs { grid-column: 1 / -1; }
    main.wrap > .stage { grid-column: 1; grid-row: 2 / 8; }
    main.wrap > :not(.tabs):not(.stage) { grid-column: 2; }
    main.wrap > .now { margin-top: 0; }
    main.wrap > h2 { margin-top: 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="../" aria-label="Cable TV home">
      <svg viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="22" fill="#1E1E2E"/><rect x="26" y="38" width="56" height="36" rx="4" fill="#fff"/><path d="M49 47l14 9-14 9z" fill="#E53935"/><path d="M45 30l9 8 9-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Cable TV</span>
    </a>
    <nav>
      <a href="../">Home</a>
      <a href="../#download">Download</a>
      <a href="../admin" class="admin-link">Admin</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="Our channels"></nav>
  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <iframe id="block" class="hidden" title="Upcoming movie trailers" allow="autoplay; encrypted-media" style="position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#000"></iframe>
    <img class="bug tr hidden" id="bug" alt="">
    <div class="off hidden" id="off"></div>
    <button class="btn primary sound" id="sound">🔊 Tap for sound</button>
    <div class="ticker hidden" id="ticker"><span id="tickerText"></span></div>
  </div>
  <div class="now">
    <img id="logo" alt="" class="hidden">
    <div style="flex:1;min-width:200px">
      <div><span class="live">LIVE</span><b id="name">Loading…</b></div>
      <div class="small" id="nowText"></div>
    </div>
    <button class="btn" id="full">⛶ Full screen</button>
  </div>
  <p class="small">Watch it on your TV too: it's channel <span id="dial">0</span> in the free <a href="../">Cable TV</a> app (type <span id="dial2">0</span> on the remote).</p>
  <h2>Coming up</h2>
  <div class="guide" id="guide"></div>
  <p class="small" id="credits" style="margin-top:18px"></p>
</main>
<footer>
  <div class="wrap">Cable TV comes to you with the compliments of <a href="https://www.bulkbazaar.ca" target="_blank" rel="noopener">Bulk Bazaar Inc.</a> · <a href="../privacy">Privacy policy</a></div>
</footer>

<script type="module">
import { firebaseConfig } from "../firebase-config.js";
import { whatsOn, guide, timeText, lengthText, tuneIn, STATIONS, expand, blockPage } from "./schedule.js";
import { mountCards } from "./cards.js";
import { torontoDay } from "./ytorder.js";
const $ = id => document.getElementById(id);
const video = $("video");
// Which of our channels: ?c=filmein is Spark Cinema, ?c=sur Spark Music, ?c=kids Spark Kids, ?c=sports Spark Sports, ?c=travel Spark Travel, ?c=comedy Spark Comedy, otherwise Spark TV.
const wanted = new URLSearchParams(location.search).get("c");
// Spark Hits (23) runs on its own page (bollywood.html), so it isn't in STATIONS.
const HITS = { id: "hits", name: "Spark Hits", dial: "23", logo: "logos/spark-hits.png", web: "bollywood.html",
  credits: "Music: official videos from the music labels' own YouTube channels." };
const station = wanted === "hits" ? HITS : STATIONS.find(x => x.id === wanted) || STATIONS[0];
// Channels that run on our locked YouTube page (and Hits) play in the player box here, like channel 1
// (owner, 2026-10-09: clicking a channel must never leave the page player for a full-window page).
const embedded = !!(station.yt || station === HITS);
// Spark Hits (0000) is its own page (the music labels' YouTube videos, one after another),
// so it gets a tab between 3 and 5.
function hitsTab() {
  const a = document.createElement("a");
  a.href = "./?c=hits";
  if (station === HITS) a.className = "sel";
  a.innerHTML = `<img alt="" src="logos/spark-hits.png"><span>23  Spark Hits</span>`;
  $("tabs").appendChild(a);
}
for (const st of STATIONS) {
  if (st.dial === "24") hitsTab();  // Hits is 23: its tab goes between 22 and 24 (schedule.js)
  const a = document.createElement("a");
  a.href = st.id === "main" ? "./" : `./?c=${st.id}`;
  if (st === station) a.className = "sel";
  a.innerHTML = `<img alt=""><span></span>`;
  a.querySelector("img").src = st.logo;
  a.querySelector("span").textContent = `${st.dial}  ${st.name}`;
  $("tabs").appendChild(a);
}
$("dial").textContent = $("dial2").textContent = station.dial;
$("credits").textContent = station.credits;

/** The owner's public settings (channel/<id>), or the ready-made schedule until there are any. */
// Our channels keep their fixed names (owner, 2026-10-07), whatever a saved schedule says.
const load = async () => Object.assign(await loadSchedule(), { name: station.name });
async function loadSchedule() {
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/channel/${station.id}?key=${firebaseConfig.apiKey}`;
    const r = await fetch(url, { cache: "no-store" });
    if (r.ok) {
      const data = (await r.json()).fields?.data?.stringValue;
      // Spark TV's upcoming trailers: the day's list takes its entry's place.
      if (data) return expand(JSON.parse(data));
    }
  } catch {}
  const ready = await (await fetch(station.ready, { cache: "no-store" })).json();
  // A channel borrowing another's free films as its backup keeps its own name and logo.
  return expand(station.backup ? { ...ready, name: station.name, logo: station.logo, ...(station.noBug ? { logoCorner: "off" } : {}) } : ready);
}

if (embedded) playEmbedded();
let c = embedded ? null : await load(), tv = null;
function show() {
  document.title = `${c.name || "My Channel"} · Watch live`;
  $("name").textContent = c.name || "My Channel";
  if (c.logo) {
    $("logo").src = c.logo; $("logo").classList.remove("hidden"); $("favicon").href = /\/channel\/logos\/bazaar-[a-z]+\.png$/.test(c.logo) ? c.logo.replace(/\.png$/, "-square.png") : c.logo;
    $("bug").src = c.logo;
  }
  const corner = c.logoCorner || "tr";
  $("bug").className = `bug ${corner}` + (!c.logo || corner === "off" ? " hidden" : "");
  const tick = c.tickerOn !== false && (c.ticker || "").trim();
  $("ticker").classList.toggle("hidden", !tick);
  $("tickerText").textContent = tick || "";
  renderGuide();
}
const isShow = g => station.id === "ads" || g.slot || !g.video.kind || g.video.kind === "programme" || g.video.kind === "live";
function renderGuide() {
  const tz = c.tz || "America/Toronto";
  const now = Date.now();
  // Viewers see the programmes; ads and idents between them are left out of the guide.
  const list = guide(c, now - 1, 12, 120).filter((g, i) => i === 0 || isShow(g)).slice(0, 25);
  $("guide").innerHTML = "";
  list.forEach((g, i) => {
    const d = document.createElement("div");
    if (i === 0) d.className = "cur";
    d.innerHTML = `<span class="t"></span><span></span><span class="l"></span>`;
    d.children[0].textContent = i === 0 ? "Now" : timeText(g.at, tz);
    d.children[1].textContent = g.video.title + (g.resumed ? " (continues)" : "");
    d.children[2].textContent = lengthText(g.video.secs);
    $("guide").appendChild(d);
  });
  if (!list.length) $("guide").innerHTML = `<p class="small">Nothing booked yet.</p>`;
}
function onChange(on) {
  $("off").classList.add("hidden");
  // No ads while the news is on (owner, 2026-10-08): the line with the "advertise with us" words hides.
  $("ticker").classList.toggle("hidden", !$("tickerText").textContent || /^news-/.test((on.video && on.video.id) || ""));
  const next = guide(c, Date.now(), 6, 60).slice(1).find(isShow);
  $("nowText").textContent = `Now: ${on.video.title}` + (next ? `  ·  Next: ${next.video.title} at ${timeText(next.at, c.tz)}` : "");
  renderGuide();
}
function onOff(on) {
  $("off").classList.remove("hidden");
  $("off").textContent = `${c.name || "This channel"} is off air right now.` + (on.next ? ` Next: ${on.next.title} at ${timeText(on.nextAt, c.tz)}.` : "");
  $("nowText").textContent = "Off air";
}
if (!embedded) {
show();
// Every 10 minutes "Up next", every 20 minutes today's shows, with the ad breaks.
mountCards($("stage"), () => c);
if (c.active === false) onOff({});
else tv = tuneIn(video, c, { onChange, onOff, onBlock });
}

/** Spark TV's upcoming trailers: our locked YouTube page over the player while they're on. */
function onBlock(b) {
  const frame = $("block");
  if (!b) {
    frame.classList.add("hidden");
    if (frame.getAttribute("src")) frame.removeAttribute("src");
    return;
  }
  const src = blockPage(c, b);
  if (frame.getAttribute("src") !== src) frame.src = src;
  frame.classList.remove("hidden");
}

/** A YouTube-run channel (or Hits): its locked page in the player box, with today's guide from its locked day. */
async function playEmbedded() {
  document.title = `${station.name} · Watch live`;
  $("name").textContent = station.name;
  $("logo").src = station.logo; $("logo").classList.remove("hidden");
  $("favicon").href = station.logo.replace(/\.png$/, "-square.png");
  video.classList.add("hidden"); $("sound").classList.add("hidden");
  const frame = $("block");
  frame.title = station.name;
  frame.setAttribute("allowfullscreen", "");
  frame.allow = "autoplay; encrypted-media; fullscreen";
  frame.src = station === HITS ? "bollywood.html" : `ytc.html?c=${station.id}`;
  frame.classList.remove("hidden");
  $("guide").innerHTML = `<p class="small">Today's programmes show here once the day's schedule is ready.</p>`;
  try {
    const r = await fetch(`locked/${station.id}.json`, { cache: "no-cache" });
    if (!r.ok) return;
    const { date, start } = torontoDay();
    const items = (await r.json()).days?.[date];
    if (!items?.length) return;
    const total = items.reduce((t, x) => t + (x.secs || 0), 0);
    const loop = Math.floor((Date.now() - start) / 1000 / total);
    let at = start + loop * total * 1000;
    const shows = [];
    for (let k = 0; k < items.length * 2 && shows.length < 25; k++) {
      const x = items[k % items.length];
      const end = at + x.secs * 1000;
      if (end > Date.now() && x.kind === "video" && x.v) shows.push({ at, title: x.v.title, secs: x.secs });
      at = end;
    }
    $("guide").innerHTML = "";
    shows.forEach((g, i) => {
      const d = document.createElement("div");
      if (i === 0) d.className = "cur";
      d.innerHTML = `<span class="t"></span><span></span><span class="l"></span>`;
      d.children[0].textContent = g.at <= Date.now() ? "Now" : timeText(g.at, "America/Toronto");
      d.children[1].textContent = g.title;
      d.children[2].textContent = lengthText(g.secs);
      $("guide").appendChild(d);
    });
    if (shows[0]) $("nowText").textContent = `Now: ${shows[0].title}` + (shows[1] ? `  ·  Next: ${shows[1].title} at ${timeText(shows[1].at, "America/Toronto")}` : "");
  } catch {}
}

$("sound").onclick = () => { video.muted = false; video.play().catch(() => {}); $("sound").classList.add("hidden"); };
$("full").onclick = () => $("stage").requestFullscreen?.();
// New settings from the owner arrive within 5 minutes.
if (!embedded) setInterval(async () => {
  try {
    const n = await load();
    if (JSON.stringify(n) === JSON.stringify(c)) return;
    c = n; show();
    if (tv) tv.update(c); else if (c.active !== false) tv = tuneIn(video, c, { onChange, onOff, onBlock });
  } catch {}
}, 5 * 60000);
</script>
<script src="../assets/visits.js"></script>
<script src="clock.js"></script>
</body>
</html>
