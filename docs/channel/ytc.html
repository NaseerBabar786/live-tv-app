<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cable TV · Watch live</title>
<meta name="description" content="Our channels on Cable TV: official videos from well-known YouTube channels, round the clock.">
<style>
  /* Our channels that run like Bazaar Hits (1.9.47): official uploads from well-known YouTube
     channels (list built by tools/build_youtube_channels.py), one after another in YouTube's own
     player, locked so nobody can pause, skip or leave for YouTube (the owner's rule for every
     YouTube channel). ?c=<station id>; the app adds &app=1. When YouTube won't play, the channel's
     free-film schedule plays instead (on the website: channel/?c=<id>; in the app: its own player). */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .shield { position: absolute; inset: 0; background: transparent; }
  .bug { position: absolute; top: 3%; right: 2.5%; height: 6.75vw; max-width: 19.5vw; object-fit: contain; opacity: .55; pointer-events: none; }
  .now { position: absolute; left: 3%; bottom: calc(var(--strip) + 5%); max-width: 70%; background: rgba(16,24,39,.85); color: #fff; padding: .6em 1em; border-radius: 10px; font-weight: 700; font-size: clamp(13px, 2.2vw, 26px); transition: opacity .6s; pointer-events: none; }
  .now small { display: block; font-weight: 400; opacity: .8; font-size: .7em; }
  .hide { opacity: 0; }
  .sound, .back { position: absolute; top: 3%; left: 2.5%; padding: .6em 1em; border-radius: 999px; border: 0; background: #E53935; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .back { left: auto; right: 30%; background: rgba(16,24,39,.85); text-decoration: none; }
  /* The scrolling line sits in its own strip under the picture, never over YouTube's player
     (YouTube's rules); the player, its cover and the clear sheet stop just above it. */
  :root { --strip: clamp(22px, 3.4vw, 40px); }
  #player, .cover, .shield { top: 0; bottom: auto !important; height: calc(100% - var(--strip)) !important; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip); line-height: var(--strip); background: #101827; color: #fff; overflow: hidden; white-space: nowrap; font-size: clamp(12px, 1.8vw, 22px); pointer-events: none; }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 40s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 22vh !important; color: #fff; text-align: center; padding: 20px; }
  /* Shown when the picture hasn't started: only our own name, never where the video comes from or
     any technical detail (owner, 1.10.24); those go to the log for us. */
  .diag { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%; text-align: center; background: rgba(0,0,0,.75); color: #fff; padding: .6em 1.1em; border-radius: 10px; font-size: clamp(12px, 2vw, 24px); pointer-events: none; }
  /* Our own black card over the player until the video really plays: no YouTube loading screen or logo first. */
  .cover { position: absolute; inset: 0; background: #000; display: grid; place-items: center; transition: opacity .4s; pointer-events: none; }
  /* While a video starts: only a loading circle in the middle, never our logo (owner, 2026-10-07). */
  .spin { width: 8vh; height: 8vh; box-sizing: border-box; border: .8vh solid rgba(255,255,255,.18); border-top-color: rgba(255,255,255,.85); border-radius: 50%; animation: spin 1s linear infinite; }
  .cover.off .spin { animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cover.off { opacity: 0; }
  .bug.tl { right: auto; left: 2.5%; }
  .bug.br { top: auto; bottom: 12%; }
  .bug.bl { top: auto; bottom: 12%; right: auto; left: 2.5%; }
  /* YouTube's own bars (its title along the top, its buttons and logo along the bottom) still showed on the
     owner's TV with its buttons turned off (film.html, 1.9.99). The player is made taller than its box, so
     YouTube puts the picture exactly in the box and draws its bars above it (off the screen) and below it
     (under our ticker strip, or off the screen): only the picture and our own things show. Owner's rule
     2026-10-07, checked by tools/preair_check.py. */
  :root { --box: calc(100vh - var(--strip)); }
  #player { top: calc(var(--box) * -0.2) !important; height: calc(var(--box) * 1.4) !important; left: 50% !important; right: auto !important; width: min(100vw, calc(var(--box) * 16 / 9)) !important; transform: translateX(-50%); }
  /* Half-hour channels (Spark Shayari): our own "today on the channel" and weather cards in the 5-minute break,
     drawn here so they're always right; Urdu in Nastaliq, over calm library music (credited). */
  .card { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - var(--strip)); z-index: 4; color: #fff; overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #4a2050 0%, #241030 45%, #0e0a1e 100%); font-family: system-ui, sans-serif; }
  .card .frame { position: absolute; inset: 2.2vh 1.6vw; border: 2px solid rgba(232,190,110,.55); border-radius: 18px; }
  .card .ur { font-family: "Noto Nastaliq Urdu", serif; direction: rtl; }
  .card h1 { position: absolute; top: 5vh; left: 0; right: 0; margin: 0; text-align: center; color: #e8be6e; font-weight: 700; font-size: 5.4vh; line-height: 2.1; }
  .card .logo { position: absolute; top: 5.5vh; right: 4vw; height: 7vh; }
  .card .sub { position: absolute; top: 17.5vh; left: 0; right: 0; text-align: center; font-size: 2.6vh; color: #e9dcc4; line-height: 2; }
  .card .rows { position: absolute; top: 26vh; left: 6vw; right: 6vw; bottom: 9vh; display: flex; flex-direction: column; justify-content: space-evenly; }
  .card .row { display: flex; align-items: center; gap: 2vw; border-bottom: 1px solid rgba(232,190,110,.18); padding: .2vh 0; }
  .card .row .t { flex: 0 0 auto; min-width: 14vw; font-weight: 700; font-size: 3vh; color: #e8be6e; direction: rtl; text-align: right; }
  .card .row .w { flex: 1; min-width: 0; font-size: 2.6vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: right; line-height: 2.2; }
  .card .row.now .w, .card .row.now .t { color: #fff6d8; }
  .card .row { flex-direction: row-reverse; }
  .card .cities { position: absolute; top: 27vh; left: 6vw; right: 6vw; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; direction: rtl; }
  .card .city { background: rgba(255,255,255,.07); border: 1px solid rgba(232,190,110,.35); border-radius: 16px; text-align: center; padding: 2.5vh 1vw; }
  .card .city .n { font-size: 3.6vh; color: #e8be6e; line-height: 2.1; }
  .card .city .i { font-size: 8vh; line-height: 1.2; }
  .card .city .d { font-size: 6.5vh; font-weight: 800; }
  .card .city .c { font-size: 2.5vh; color: #e9dcc4; line-height: 2.2; }
  .card .city .r { font-size: 2.2vh; color: #cbbfa8; }
  .card .credit { position: absolute; bottom: 4vh; left: 0; right: 0; text-align: center; font-size: 1.7vh; color: rgba(233,220,196,.75); }
</style>

<body>

<div class="now hide" id="now"></div>

<div class="ticker"><span id="tick"></span></div>

<script src="promo.js"></script>

<script type="module">
// The player's own code loads while the channel's lists are fetched, not after (owner: our channels
// were slow to start, 1.10.24); the player starts once both are ready.
let dataReady;
const ready = new Promise(r => dataReady = r);
{ const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); }
import { STATIONS } from "./schedule.js";
import { loadPicks, loadPromos, loadTrailers, loadLocked, loadOwnClips, dayPlan, itemAt, torontoDay, lengthOf as lengthIn, HALF, TZ } from "./ytorder.js";
const q = new URLSearchParams(location.search);
const app = q.has("app");
const $ = id => document.getElementById(id);
const station = STATIONS.find(s => s.id === q.get("c")) || STATIONS.find(s => s.yt);
// Spark (owner, 2026-10-08): the Cable TV test version asks for the new names and logos; everyone else still sees Bazaar.
if (q.get("brand") === "spark") Object.assign(station, {
  name: station.name.replace(/^Bazaar(?= )/, "Spark"),
  logo: station.logo.replace("/logos/bazaar-", "/logos/spark-").replace("/logos/latest-movies.png", "/logos/spark-latest.png"),
  // Spark Shayari has an Urdu look: its corner logo and name in Urdu.
  ...(station.urduBug ? { bug: station.urduBug, shownName: station.nameUrdu } : {}),
});
let items = [], cur = 0, inBreak = false, player = null, nowTimer = null, failures = 0;
// How far this screen runs ahead of the clock (ms): after a programme that ends a long while before its
// listed end, or won't play at all, the channel goes straight on to the next one instead of standing still.
let ahead = 0;
const clock = () => Date.now() + ahead;

document.title = station.name + " · Watch live";
// Latest Movies carries no logo of ours (the owner's wish).
if (station.noBug) $("bug").hidden = true;
else $("bug").src = station.bug || station.logo;
$("tick").textContent = `${station.name} · ${station.tagline || ""} · Channel ${station.dial} on Cable TV · Advertise with us: WhatsApp 437 602 6500 · tv.bulkbazaar.ca/advertise`;
if (!app) $("back").hidden = false;

/** YouTube won't play here: the channel's free-film schedule plays instead. */
function fallBack() {
  // Spark Gurbani (noBackup): never another channel's music in its place; a wait card, then try again.
  if (station.noBackup) return holdOn();
  if (app) location.href = "livetv://fallback";
  else location.replace(`./?c=${station.id}`);
}

function holdOn() {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;z-index:50;background:#0b0b14;color:#fff;display:flex;flex-direction:column;" +
    "align-items:center;justify-content:center;gap:18px;font:600 4vh system-ui,sans-serif;text-align:center";
  d.innerHTML = `<img alt="" src="${station.logo}" style="height:18vh"><div>${station.name}</div>` +
    `<div style="font-weight:400;font-size:2.6vh;opacity:.75">Back in a moment</div>`;
  document.body.appendChild(d);
  setTimeout(() => location.reload(), 120000);
}

const lengthOf = v => lengthIn(v, station);
// Our logo never sits on the uploader's own logo (the owner's rule): logo-corners.json says which corner is free.
let corners = { default: "tr", labels: {} }, bugLabel = null;
fetch("logo-corners.json", { cache: "no-store" }).then(r => r.json()).then(c => { corners = c; placeBug(bugLabel); }).catch(() => {});
function placeBug(label) {
  bugLabel = label;
  const corner = corners.labels?.[label] || corners.default || "tr";
  document.querySelector(".bug").className = "bug " + corner;
}
function showNow() {
  const v = items[cur]?.v;
  if (!v) return;
  placeBug(v.label);
  $("now").innerHTML = "<span></span><small></small>";
  // A long mushaira in 25-minute parts: "Part 2" (in Urdu on our Urdu channel).
  $("now").firstChild.textContent = v.title + (items[cur].part ? (station.nameUrdu ? ` · حصہ ${items[cur].part}` : ` · Part ${items[cur].part}`) : "");
  const name = station.shownName || station.name;
  $("now").lastChild.textContent = items[cur].clip ? `Coming up on ${name}` : name + " · " + (items[cur].trailer ? "Coming soon · " : "") + v.label;
  $("now").classList.remove("hide");
  clearTimeout(nowTimer);
  nowTimer = setTimeout(() => $("now").classList.add("hide"), 8000);
}
/**
 * Plays item [i] of the running order from [offset] seconds in: a programme in YouTube's player, or an
 * ad break of our own promos (promo.js playBreak) before it.
 */
function playItem(i, offset = 0) {
  cur = (i + items.length) % items.length;
  const it = items[cur];
  cover(true);
  if (it.card) return playCard(it, offset, cur);
  document.querySelector(".card")?.remove();
  bedAudio?.pause();
  if (it.kind === "break") {
    inBreak = true;
    try { player.stopVideo(); } catch {}
    const at = cur;
    playBreak(it.promos, offset, player.isMuted(), () => {
      inBreak = false;
      // An ad skipped: the channel goes on from there (no second break to make up the time).
      const w = itemAt(items, clock());
      if (w.i === at) ahead += (items[at].secs - w.offset) * 1000;
      rejoin(at);
    });
    return;
  }
  inBreak = false;
  // A video our daily check found can't play here (channel/unplayable.json): its time is filled at once.
  if (unplayable[it.v.id]) return endedEarly(cur);
  // A "coming up" clip plays 45 seconds from inside one of the channel's next films.
  // The rest of last night's film (cont) also starts part-way into its video.
  const base = it.start || 0;
  target = { id: it.v.id, at: Date.now() - offset * 1000, base, item: cur };
  // A part of a long programme stops where the break comes, like a clip.
  player.loadVideoById(it.clip || it.cut ? { videoId: it.v.id, startSeconds: base + offset, endSeconds: base + it.secs } : { videoId: it.v.id, startSeconds: base + offset });
  showNow();
}
// ---------- The cards in a half-hour channel's 5-minute break: today's programmes and the weather ----------
const URDU_LABELS = { "Rekhta": "ریختہ", "Urdu Studio": "اردو اسٹوڈیو", "PTV Home": "پی ٹی وی ہوم", "PTV National": "پی ٹی وی نیشنل",
  "DD Urdu": "ڈی ڈی اردو", "Sahitya Akademi": "ساہتیہ اکادمی", "Lahore Literary Festival": "لاہور ادبی میلہ", "Faiz Festival": "فیض میلہ",
  "Mushaira Media": "مشاعرہ", "Sahitya Tak": "ساہتیہ تک", "Kommune": "کمیون", "The Social House": "دی سوشل ہاؤس" };
const urduTime = ms => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit", hourCycle: "h23" }).formatToParts(ms).map(x => [x.type, x.value]));
  const h = +p.hour, when = h < 4 ? "رات" : h < 12 ? "صبح" : h < 16 ? "دوپہر" : h < 19 ? "شام" : "رات";
  return `${when} ${(h % 12) || 12}:${p.minute}`;
};
const shortTitle = t => (t || "").split(/\s[|｜#]\s?|\s-\s|\s:\s/)[0].trim().slice(0, 70);
let bed = null;
if (station.ownClips) fetch(station.ownClips, { cache: "no-cache" }).then(r => r.json()).then(d => { bed = d.bed || null; }).catch(() => {});
let bedAudio = null;
function cardShell(title) {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<div class="frame"></div><img class="logo" alt=""><h1 class="ur"></h1><div class="credit"></div>`;
  c.querySelector("h1").textContent = title;
  c.querySelector(".logo").src = station.bug || station.logo;
  c.querySelector(".credit").textContent = bed?.credit || "";
  return c;
}
/** The next 8 half hours: what starts in each (a programme carrying on says so). */
function todayCard(fromIdx) {
  const c = cardShell("آج کے پروگرام");
  const sub = document.createElement("div");
  sub.className = "sub ur";
  sub.textContent = "ہر آدھے گھنٹے: پچیس منٹ شاعری، پھر آج کا شعر اور موسم · ٹورنٹو کا وقت";
  const rows = document.createElement("div");
  rows.className = "rows";
  c.append(sub, rows);
  const { start } = torontoDay(clock());
  let t = 0;
  const begins = items.map(x => { const at = t; t += x.secs; return at; });
  const firstHalf = Math.floor((begins[fromIdx] || 0) / HALF) + 1;
  for (let h = firstHalf; h < firstHalf + 8; h++) {
    const k = items.findIndex((x, n) => x.kind === "video" && begins[n] >= h * HALF && begins[n] < h * HALF + HALF - 300);
    if (k < 0) continue;
    const it = items[k];
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span class="t ur"></span><span class="w ur"></span>`;
    r.firstChild.textContent = urduTime(start + h * HALF * 1000);
    r.lastChild.textContent = `${URDU_LABELS[it.v.label] || it.v.label}: ${shortTitle(it.v.title)}${it.part ? " (جاری)" : ""}`;
    rows.appendChild(r);
  }
  return c;
}
const CITIES = [["ٹورنٹو", 43.65, -79.38], ["لاہور", 31.55, 74.34], ["کراچی", 24.86, 67.01], ["دہلی", 28.61, 77.21]];
const SKY = c => c === 0 ? ["☀️", "صاف آسمان"] : c <= 2 ? ["⛅", "کچھ بادل"] : c === 3 ? ["☁️", "بادل"] : c <= 48 ? ["🌫️", "دھند"]
  : c <= 57 ? ["🌦️", "ہلکی بوندا باندی"] : c <= 67 ? ["🌧️", "بارش"] : c <= 77 ? ["❄️", "برف"] : c <= 82 ? ["🌧️", "بارش کی بوچھاڑ"] : c <= 86 ? ["🌨️", "برف باری"] : ["⛈️", "گرج چمک"];
let weather = null, weatherAt = 0;
async function loadWeather() {
  if (weather && Date.now() - weatherAt < 20 * 60e3) return weather;
  const q = `latitude=${CITIES.map(x => x[1]).join(",")}&longitude=${CITIES.map(x => x[2]).join(",")}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
  const d = await (await fetch("https://api.open-meteo.com/v1/forecast?" + q)).json();
  weather = Array.isArray(d) ? d : [d]; weatherAt = Date.now();
  return weather;
}
function weatherCard(w) {
  const c = cardShell("موسم");
  const g = document.createElement("div");
  g.className = "cities";
  CITIES.forEach(([name], k) => {
    const x = w[k];
    if (!x?.current) return;
    const [icon, words] = SKY(x.current.weather_code);
    const b = document.createElement("div");
    b.className = "city";
    b.innerHTML = `<div class="n ur"></div><div class="i"></div><div class="d"></div><div class="c ur"></div><div class="r"></div>`;
    b.children[0].textContent = name;
    b.children[1].textContent = icon;
    b.children[2].textContent = Math.round(x.current.temperature_2m) + "°";
    b.children[3].textContent = words;
    b.children[4].textContent = `${Math.round(x.daily.temperature_2m_max[0])}° / ${Math.round(x.daily.temperature_2m_min[0])}°`;
    g.appendChild(b);
  });
  c.appendChild(g);
  return c;
}
/** A card plays for its time in the running order, with the calm music under it; then the channel goes on. */
async function playCard(it, offset, at) {
  inBreak = true;
  try { player.stopVideo(); } catch {}
  cover(true);
  let el = null;
  if (it.card === "weather") { try { el = weatherCard(await loadWeather()); } catch { el = null; } }
  // No weather (it couldn't be fetched): today's programmes stay up instead.
  if (!el) el = todayCard(at);
  if (cur !== at) return;
  document.querySelector(".card")?.remove();
  document.body.appendChild(el);
  if (bed?.src && !player.isMuted()) {
    if (!bedAudio) { bedAudio = new Audio(bed.src); bedAudio.loop = true; bedAudio.volume = 0.5; }
    // The music runs on through both cards: started once, at a point that follows the clock.
    if (bedAudio.paused) { try { bedAudio.currentTime = (Date.now() / 1000) % (bed.secs || 300); } catch {} bedAudio.play().catch(() => {}); }
  }
  setTimeout(() => {
    if (cur !== at) return;
    el.remove();
    const next = items[(at + 1) % items.length];
    if (!next?.card && bedAudio) bedAudio.pause();
    inBreak = false;
    rejoin(at);
  }, Math.max(0.5, it.secs - offset) * 1000);
}

/** Like TV, the clock decides what's on: after a programme (or an ad break) the channel goes on wherever it is now. */
function rejoin(ended) {
  if (torontoDay().date !== day) {
    // A new day: its locked schedule (or, without one, the day worked out here), back on the clock.
    const date = torontoDay().date;
    ahead = 0;
    return loadLocked(station, "", date).then(lk => { locked = lk && { date, items: lk }; order(); const w = itemAt(items); playItem(w.i, w.offset); });
  }
  let w = itemAt(items, clock());
  // Never back to a programme that has already finished (ads that couldn't play end at once): on from there.
  if (items[w.i] === finished && w.i !== ended) { ahead += (items[w.i].secs - w.offset) * 1000; w = itemAt(items, clock()); }
  // The one that just ended (a little early against its listed length, or an ad skipped): the next one, from the top.
  if (w.i === ended) return playItem(ended + 1, 0);
  playItem(w.i, w.offset < 10 ? 0 : w.offset);
}
/**
 * Programme [i] has finished before its listed end (its video is shorter than listed, or it won't play).
 * Never dead air: a short gap is filled with our promos, then the next programme starts on time; a long
 * one, or when there's nothing to fill it with, goes straight on to the next programme.
 */
const FILL_MAX = 3 * 60;
let finished = null;
function endedEarly(i) {
  finished = items[i];
  const w = itemAt(items, clock());
  if (w.i !== i) return rejoin(i);   // ended on time (or late): wherever the clock is now
  const gap = items[i].secs - w.offset;
  const fill = [];
  let total = 0;
  if (gap >= 20 && gap <= FILL_MAX) {
    for (let k = 0; promos.length && k < 12; k++) {
      const p = promos[(fillAt + k) % promos.length];
      if (total + p.secs > gap + 5) continue;
      fill.push(p); total += p.secs;
    }
  }
  if (!fill.length) { ahead += Math.max(0, gap) * 1000; return playItem(i + 1, 0); }
  fillAt += fill.length;
  inBreak = true;
  try { player.stopVideo(); } catch {}
  cover(true);
  ahead += Math.max(0, gap - total) * 1000;
  playBreak(fill, 0, player.isMuted(), () => { inBreak = false; rejoin(i); });

let fillAt = 0;
// Some TVs ignore where the video was asked to start; once it plays, it's moved to where the channel is.
let target = null;
function keepInStep() {
  if (inBreak || !player || !target || !player.getCurrentTime || player.getPlayerState() !== YT.PlayerState.PLAYING || player.getVideoData?.().video_id !== target.id) return;
  const want = (Date.now() - target.at) / 1000, have = player.getCurrentTime() - target.base;
  // A clip that has run its 45 seconds: the channel goes on (some players don't stop at the end point).
  if ((items[cur].clip || items[cur].cut) && have >= items[cur].secs - 0.5) return rejoin(cur);
  if (Math.abs(want - have) > 30 && want < items[cur].secs - 30) player.seekTo(target.base + want, true);
}
/**
 * A frozen screen never stays: a video stuck loading, or on one frame, for 30 seconds is loaded again
 * where the channel is; stuck a second time, the channel goes on to the next programme.
 */
let lastT = -1, movedAt = Date.now(), stuckItem = -1, stuckTimes = 0;
function watchStall() {
  if (inBreak || !player?.getPlayerState || !started) { movedAt = Date.now(); return; }
  const t = player.getCurrentTime?.() || 0, playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  if (playing && t !== lastT) { lastT = t; movedAt = Date.now(); return; }
  lastT = t;
  if (Date.now() - movedAt < 30000) return;
  movedAt = Date.now();
  lastError = "stuck";
  if (stuckItem !== cur) { stuckItem = cur; stuckTimes = 0; }
  if (++stuckTimes === 1) { const w = itemAt(items, clock()); return w.i === cur ? playItem(cur, w.offset) : rejoin(cur); }
  endedEarly(cur);
}
// The day's running order with its ad breaks: the locked day (the owner's from Channel Studio, or
// channel/locked/<id>.json written every night, so the day never changes once it has begun), or, when there is none, worked out the same way here from
// the programmes the owner approved in Channel Studio (📺 Programmes).
let all = [], unplayable = {}, picks = null, promos = [], trailers = [], own = [], day = null, locked = null;
function order() {
  day = torontoDay().date;
  items = locked && locked.date === day ? locked.items : dayPlan(station, { list: all, picks, promos, trailers, own }, day);
}

// The owner can unlock today in Channel Studio to fix a mistake: the fixed day comes in within 5 minutes,
// from the next programme on (what has played and what's on now stay as they were).
setInterval(() => {
  if (!day) return;
  loadLocked(station, "", day).then(lk => {
    if (!lk || torontoDay().date !== day || JSON.stringify(lk) === JSON.stringify(locked?.items)) return;
    locked = { date: day, items: lk };
    order();
  });
}, 5 * 60e3);

let joinAt = 0;
Promise.all([fetch(`yt-${station.id}.json`, { cache: "no-cache" }).then(r => r.json()), loadPicks(), loadPromos(), loadTrailers(station), loadLocked(station), loadOwnClips(station),
  // What the nightly check and the hourly pre-air check (tools/preair_check.py) found won't play here.
  Promise.all(["unplayable.json", "preair-bad.json"].map(f => fetch(f, { cache: "no-cache" }).then(r => r.json()).catch(() => ({}))))
    .then(([a, b]) => ({ ids: { ...(a.ids || {}), ...(b.ids || {}) } }))]).then(([d, p, pr, tr, lk, oc, un]) => {
  if (!d.videos || d.videos.length < 3) return fallBack();
  unplayable = un.ids || {};
  all = d.videos.filter(v => !unplayable[v.id]);
  picks = p[station.id] || null;
  // A channel with noAds (Spark Gurbani, owner 2026-10-08) has no breaks at all.
  promos = station.noAds ? [] : pr;
  trailers = station.noAds ? [] : tr;
  own = oc;
  locked = lk && { date: torontoDay().date, items: lk };
  order();
  // Nothing left to play (every programme taken off): the free films take over.
  if (!items.some(x => x.kind === "video")) return fallBack();
  // Where the channel is now: the day's running order from midnight, round the clock.
  const w = itemAt(items);
  cur = w.i;
  joinAt = w.startMs;
  dataReady();
}).catch(fallBack);

// When the picture hasn't started after 15 s, viewers see only our own short message; why it didn't
// start (player state or error, browser version) goes to the log (logcat in the app), and shows on
// screen only with ?debug=1, for us.
let started = false, lastError = null, lastState = "none";
setTimeout(() => {
  if (started || inBreak) return;
  const why = `not started (${lastError ? "error " + lastError : "state " + lastState}) · ${(navigator.userAgent.match(/Chrome\/[\d.]+/) || ["?"])[0]}`;
  console.warn("Bazaar channel " + why);
  const d = document.createElement("div");
  d.className = "diag";
  d.textContent = new URLSearchParams(location.search).has("debug") ? why : `${station.name} is starting, one moment please…`;
  document.body.appendChild(d);
}, 15000);
// The cover goes once the video is really playing, and comes back while the next one loads.
let coverTimer = null;
function cover(on) {
  clearTimeout(coverTimer);
  if (on) $("cover").classList.remove("off");
  // 3.5 s after it starts, when YouTube's own title, logo and buttons at the start have faded away.
  else coverTimer = setTimeout(() => $("cover").classList.add("off"), 3500);
}
window.onYouTubeIframeAPIReady = () => ready.then(startPlayer);
function startPlayer() {
  // The player starts on the programme that's on (or the one after the ad break that's on).
  let f = cur;
  while (items[f % items.length].kind !== "video" && f < cur + items.length) f++;
  const first = items[f % items.length];
  player = new YT.Player("player", {
    videoId: first.v.id,
    playerVars: { autoplay: items[cur].kind === "video" ? 1 : 0, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, cc_load_policy: 0, origin: location.origin },
    events: {
      onReady: e => {
        // YouTube's own leveling leaves videos a little louder than Cable TV's leveled channels;
        // 60% brings them to the same loudness, so switching channels keeps one volume.
        e.target.setVolume(60);
        $("msg").remove();
        if (!app) { e.target.mute(); $("sound").hidden = false; }
        // The app's silent players (Duo mode) open the page with mute=1 (1.9.60).
        if (new URLSearchParams(location.search).has("mute")) e.target.mute();
        // Join where the channel is now, like live TV (an ad break part-way, or the film part-way).
        const offset = (Date.now() - joinAt) / 1000;
        playItem(cur, offset < 5 ? 0 : offset);
        setInterval(() => { keepInStep(); watchStall(); }, 1000);
      },
      // It never stays paused; the next item follows when one ends.
      onStateChange: e => {
        if (inBreak) return;
        if (e.data === YT.PlayerState.PLAYING) cover(false);
        // Any other state (loading, paused, ended, cued) shows YouTube's own screen: only our cover shows then.
        else cover(true);
        lastState = e.data;
        if (e.data === YT.PlayerState.PLAYING) { started = true; document.querySelector(".diag")?.remove(); }
        if (e.data === YT.PlayerState.PLAYING) failures = 0;
        if (e.data === YT.PlayerState.ENDED) endedEarly(cur);
        else if (e.data === YT.PlayerState.PAUSED) { if ((items[cur].clip || items[cur].cut) && e.target.getCurrentTime() >= target.base + items[cur].secs - 2) rejoin(cur); else e.target.playVideo(); }
      },
      // A video its owner won't let others play is skipped; when none will play, the free films take over.
      // (its time is filled like any programme that ends early, not by playing the next one over and over).
      onError: e => { if (inBreak) return; cover(true); lastError = e.data; if (++failures >= 5) fallBack(); else { const at = cur; setTimeout(() => at === cur && !inBreak && endedEarly(at), 1000); } },
    },
  });
  stillFor(player);
  lowFirst(player);
  keepPlaying(player, () => inBreak, () => cover(true));
};
// A tap or OK only shows what's playing; double-click goes full screen (on the website).
$("shield").onclick = showNow;
$("shield").ondblclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
$("sound").onclick = () => { player.unMute(); player.playVideo(); $("sound").hidden = true; };
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { showNow(); e.preventDefault(); }
  if (e.key === "MediaPlayPause" || e.key === "MediaPause" || e.key === "k") e.preventDefault();
});
</script>
<script src="clock.js"></script>
</body>
