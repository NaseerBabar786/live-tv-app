<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fd98a"/><stop offset="1" stop-color="#0b5a36"/></linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a6436"/><stop offset="1" stop-color="#4a2612"/></linearGradient>
    <radialGradient id="felt" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#34b874"/><stop offset="1" stop-color="#136b3f"/></radialGradient>
    <radialGradient id="dark" cx=".36" cy=".3" r=".75"><stop offset="0" stop-color="#6a6490"/><stop offset=".45" stop-color="#26233d"/><stop offset="1" stop-color="#0b0a14"/></radialGradient>
    <radialGradient id="light" cx=".36" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1ece0"/><stop offset="1" stop-color="#b9b09c"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#032a16" flood-opacity=".55"/></filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#shine)"/>
  </g>
  <g filter="url(#sh)" transform="rotate(-8 256 270)">
    <rect x="76" y="104" width="360" height="330" rx="34" fill="url(#wood)"/>
    <rect x="100" y="128" width="312" height="282" rx="14" fill="url(#felt)"/>
    <g stroke="#0b4a2a" stroke-width="3" opacity=".8"><path d="M204 128V410M308 128V410M100 222H412M100 316H412"/></g>
    <circle cx="152" cy="175" r="40" fill="url(#light)"/>
    <circle cx="256" cy="175" r="40" fill="url(#dark)"/>
    <circle cx="152" cy="269" r="40" fill="url(#dark)"/>
    <circle cx="256" cy="269" r="40" fill="url(#light)"/>
    <circle cx="360" cy="269" r="40" fill="url(#dark)"/>
    <circle cx="256" cy="363" r="40" fill="url(#dark)"/>
    <circle cx="152" cy="363" r="40" fill="url(#light)"/>
    <circle cx="360" cy="363" r="14" fill="#9b8cff" opacity=".7"/>
  </g>
  <!-- a disc mid-flip -->
  <g filter="url(#sh)" transform="rotate(18 380 150)">
    <ellipse cx="384" cy="150" rx="30" ry="66" fill="#0b0a14"/>
    <ellipse cx="374" cy="150" rx="26" ry="64" fill="url(#light)"/>
    <ellipse cx="368" cy="128" rx="8" ry="20" fill="#fff" opacity=".8"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"><path d="M312 90 q20 -26 52 -30"/><path d="M448 214 q-8 30 -36 44"/></g>
  <path d="M90 420 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill="#fff3b0"/>
</svg>
