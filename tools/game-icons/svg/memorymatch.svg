    <g opacity=".13" fill="#fff"><circle cx="40" cy="40" r="5"/><circle cx="120" cy="40" r="5"/><circle cx="200" cy="40" r="5"/><circle cx="280" cy="40" r="5"/><circle cx="360" cy="40" r="5"/><circle cx="440" cy="40" r="5"/><circle cx="80" cy="110" r="5"/><circle cx="160" cy="110" r="5"/><circle cx="240" cy="110" r="5"/><circle cx="320" cy="110" r="5"/><circle cx="400" cy="110" r="5"/><circle cx="480" cy="110" r="5"/><circle cx="40" cy="180" r="5"/><circle cx="440" cy="180" r="5"/><circle cx="40" cy="320" r="5"/><circle cx="480" cy="250" r="5"/><circle cx="40" cy="460" r="5"/><circle cx="120" cy="460" r="5"/><circle cx="200" cy="470" r="5"/><circle cx="280" cy="470" r="5"/><circle cx="360" cy="470" r="5"/><circle cx="440" cy="460" r="5"/></g>
