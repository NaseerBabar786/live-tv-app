    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#4a0020" flood-opacity=".5"/></filter>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
