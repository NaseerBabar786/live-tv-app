    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e0cc"/></linearGradient>
    <radialGradient id="pin" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#fff4c2"/><stop offset="1" stop-color="#a8761c"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#001a33" flood-opacity=".55"/></filter>
  </defs>
