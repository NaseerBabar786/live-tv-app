  <rect x="112" y="186" width="290" height="12" rx="6" fill="#fff" opacity=".3"/>
  <!-- dropping disc -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55"><path d="M346 40 V70M362 30 V78M378 40 V70"/></g>
