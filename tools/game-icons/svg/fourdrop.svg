    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7bff"/><stop offset="1" stop-color="#1238b8"/></linearGradient>
    <radialGradient id="red" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ffb3c0"/><stop offset=".45" stop-color="#ff2d4a"/><stop offset="1" stop-color="#9a0d22"/></radialGradient>
    <radialGradient id="yel" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffc21a"/><stop offset="1" stop-color="#c47a00"/></radialGradient>
    <mask id="holes"><rect width="512" height="512" fill="#fff"/>
      <g fill="#000"><circle cx="152" cy="232" r="30"/><circle cx="222" cy="232" r="30"/><circle cx="292" cy="232" r="30"/><circle cx="362" cy="232" r="30"/><circle cx="152" cy="302" r="30"/><circle cx="222" cy="302" r="30"/><circle cx="292" cy="302" r="30"/><circle cx="362" cy="302" r="30"/><circle cx="152" cy="372" r="30"/><circle cx="222" cy="372" r="30"/><circle cx="292" cy="372" r="30"/><circle cx="362" cy="372" r="30"/></g></mask>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000a40" flood-opacity=".55"/></filter>
