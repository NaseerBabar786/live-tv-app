  <!-- discs behind frame -->
  <g>
    <rect x="96" y="176" width="322" height="252" fill="#061a5a"/>
    <circle cx="152" cy="372" r="32" fill="url(#red)"/><circle cx="222" cy="372" r="32" fill="url(#yel)"/><circle cx="292" cy="372" r="32" fill="url(#red)"/><circle cx="362" cy="372" r="32" fill="url(#yel)"/>
